<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="description" content="📋 דף רמז מבחן — כל 9 המבחנים בדף אחד — פורטל הכנה למבחן Fullstack">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📋 דף רמז מבחן — כל 9 המבחנים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--ink:#0f172a;--card:#fff;--brand:#7c3aed;--gold:#facc15;--green:#16a34a;--blue:#2563eb;--red:#dc2626;--orange:#f97316;--shadow:4px 4px 0 #0f172a}
*{box-sizing:border-box;margin:0}
body{font-family:'Heebo',Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}

.hero{background:linear-gradient(135deg,#020617,#1e1b4b 50%,#7c3aed);color:#fff;padding:22px 24px;border-bottom:4px solid #000;text-align:center}
.hero h1{font-size:clamp(20px,4vw,32px);margin:0}
.hero p{color:#dbeafe;font-size:13px;margin:5px 0 0}

/* Controls bar */
.controls{background:#fff;border-bottom:3px solid #000;padding:12px 20px;display:flex;align-items:center;gap:10px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
.ctrl-select{padding:8px 14px;border:2.5px solid #000;border-radius:10px;font:inherit;font-weight:800;font-size:13px;background:#fff;box-shadow:2px 2px 0 #000;cursor:pointer}
.ctrl-btn{padding:8px 16px;border:2.5px solid #000;border-radius:10px;font:inherit;font-weight:900;font-size:13px;cursor:pointer;box-shadow:2px 2px 0 #000;transition:.15s;display:flex;align-items:center;gap:6px}
.ctrl-btn:hover{transform:translateY(-1px);box-shadow:3px 3px 0 #000}
.ctrl-btn.print{background:var(--brand);color:#fff}
.ctrl-btn.all{background:var(--gold);color:#000}
.ctrl-label{font-weight:800;font-size:13px;color:#475569}

/* Main layout */
.main{max-width:1200px;margin:0 auto;padding:20px 16px}

/* Exam sheet */
.exam-sheet{background:#fff;border:3px solid #000;border-radius:16px;margin-bottom:20px;overflow:hidden;box-shadow:var(--shadow)}
.exam-sheet.hidden{display:none}
.exam-head{padding:14px 20px;background:linear-gradient(135deg,#1e1b4b,#312e81);color:#fff;display:flex;align-items:center;gap:12px;font-weight:900;font-size:18px;border-bottom:3px solid #000}
.exam-head .pts{margin-right:auto;font-size:13px;color:var(--gold);font-weight:900}
.exam-body{display:grid;grid-template-columns:1fr 1fr 1fr;gap:0}

/* Q columns */
.q-col{padding:16px;border-right:2px solid #e2e8f0}
.q-col:last-child{border-right:none}
.q-type{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border:2px solid #000;border-radius:6px;font-weight:900;font-size:11px;margin-bottom:10px;box-shadow:1px 1px 0 #000}
.q-type.react{background:#dbeafe;color:#1e40af}
.q-type.js{background:#fef9c3;color:#854d0e}
.q-type.express{background:#d1fae5;color:#065f46}
.q-type.theory{background:#fce7f3;color:#9d174d}
.q-title{font-weight:900;font-size:13px;margin-bottom:10px;padding-bottom:6px;border-bottom:2px dashed #e2e8f0}

/* Section label */
.sec{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:#64748b;margin:8px 0 4px;display:flex;align-items:center;gap:4px}
.sec::after{content:'';flex:1;height:1px;background:#e2e8f0}

/* Items */
.item{font-size:12px;font-weight:600;padding:3px 0;display:flex;align-items:flex-start;gap:5px;line-height:1.45}
.item::before{content:'·';font-weight:900;color:#94a3b8;margin-top:0;flex-shrink:0}
.item.critical{color:var(--red)}
.item.critical::before{content:'⚠';color:var(--red)}
.item.good::before{content:'✦';color:var(--brand)}

/* Regex chips */
.regex{font-family:Consolas,'Courier New',monospace;font-size:10.5px;background:#f1f5f9;border:1.5px solid #cbd5e1;border-radius:4px;padding:1px 5px;color:#1e293b;word-break:break-all;cursor:copy;transition:.15s;display:inline-block}
.regex:hover{background:#dbeafe;border-color:#93c5fd}

/* Code snippet */
.code-snip{font-family:Consolas,'Courier New',monospace;font-size:11px;background:#0f172a;color:#e2e8f0;border-radius:8px;padding:8px 10px;margin:4px 0;overflow-x:auto;border:2px solid #334155;line-height:1.5}
.code-snip .hl{color:var(--gold)}
.code-snip .cm{color:#64748b;font-style:italic}

/* Bug box */
.bug-box{background:#fef2f2;border:2px solid #fca5a5;border-radius:8px;padding:6px 8px;margin-top:8px}
.bug-title{font-size:10px;font-weight:900;color:var(--red);margin-bottom:4px}

/* Dark mode */
@media(prefers-color-scheme:dark){
  :root{--bg:#0f172a;--ink:#e2e8f0;--card:#1e293b;--shadow:4px 4px 0 #000}
  body{background:var(--bg)}
  .controls{background:#1e293b;border-color:#334155}
  .ctrl-select{background:#0f172a;color:#e2e8f0;border-color:#475569}
  .exam-sheet{background:#1e293b;border-color:#334155}
  .q-col{border-color:#334155}
  .q-title{border-color:#334155}
  .sec::after{background:#334155}
  .regex{background:#334155;border-color:#475569;color:#e2e8f0}
  .regex:hover{background:#1e3a5f;border-color:#3b82f6}
  .code-snip{border-color:#334155}
  .bug-box{background:#3b0a0a;border-color:#991b1b}
}

/* Print */
@media print{
  .hero,.controls{display:none}
  body{background:#fff}
  .exam-sheet.hidden{display:block}
  .exam-sheet{break-inside:avoid;margin-bottom:12px;box-shadow:none;border:2px solid #000}
  .main{padding:0;max-width:100%}
}

@media(max-width:700px){
  .exam-body{grid-template-columns:1fr}
  .q-col{border-right:none;border-bottom:2px solid #e2e8f0}
  .q-col:last-child{border-bottom:none}
}
</style>
</head>
<body>
<div class="hero">
  <h1>📋 דף רמז מבחן — כל 9 המבחנים</h1>
  <p>כל דרישות המבחן בתצוגה מהירה: routes, state, ולידציות, אלגוריתם, endpoints. לחץ על regex להעתקה.</p>
</div>

<div class="controls">
  <label class="ctrl-label">בחר מבחן:</label>
  <select class="ctrl-select" id="exam-select" onchange="selectExam(this.value)">
    <option value="all">📋 כל המבחנים</option>

  <button class="ctrl-btn all" onclick="selectExam('all')">📋 הכל</button>
  <button class="ctrl-btn print" onclick="window.print()">🖨 הדפס</button>
</div>

<div class="main" id="main"></div>

<script>

const EXAMS = [
{

  q2:{

const ratio=arr[1]/arr[0];
const isArith=arr.every((_,i)=>i===0||arr[i]-arr[i-1]===diff);
const isGeo=arr.every((_,i)=>i===0||arr[i]/arr[i-1]===ratio);
return isArith?"arithmetic":isGeo?"geometric":"none";`,

  },

function renderExam(exam) {
  function renderQ1() {
    const q=exam.q1;
    let html=`<div class="q-col">
      <div class="q-type ${q.type}">⚛ React — ${q.pts} נק׳</div>
      <div class="q-title">${q.title}</div>
      <div class="sec">📍 Routes</div>`;
    q.routes.forEach(r=>{
      html+=`<div class="item"><code>${r.path}</code> — ${r.label}</div>`;
    });
    html+=`<div class="sec">📦 State</div>`;
    q.state.forEach(s=>{
      html+=`<div class="item">${s}</div>`;
    });
    html+=`<div class="sec">🛡 ולידציות</div>`;
    q.validations.forEach(v=>{
      html+=`<div class="item critical"><b>${v.field}</b>: ${v.rule}`;
      if(v.regex){
        html+=`<br><span class="regex" onclick="copyText(this.textContent)" title="לחץ להעתקה">${v.regex}</span>`;
      }
      html+=`</div>`;
    });
    if(q.bugs.length){
      html+=`<div class="bug-box"><div class="bug-title">⚠ באגים נפוצים</div>`;
      q.bugs.forEach(b=>{ html+=`<div class="item critical">${b}</div>`; });
      html+=`</div>`;
    }
    html+=`</div>`;
    return html;
  }

  function renderQ2() {
    const q=exam.q2;
    let html=`<div class="q-col">
      <div class="q-type ${q.type}">🟨 JS — ${q.pts} נק׳</div>
      <div class="q-title">${q.title}</div>
      <div class="sec">🔢 שלבים</div>`;
    q.steps.forEach((s,i)=>{
      html+=`<div class="item"><b>${i+1}.</b> ${s}</div>`;
    });
    if(q.code){
      html+=`<div class="sec">💻 קוד מפתח</div>
      <div class="code-snip">${q.code.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</div>`;
    }
    if(q.bugs&&q.bugs.length){
      html+=`<div class="bug-box"><div class="bug-title">⚠ פח! לא לשכוח</div>`;
      q.bugs.forEach(b=>{ html+=`<div class="item critical">${b}</div>`; });
      html+=`</div>`;
    }
    html+=`</div>`;
    return html;
  }

  function renderQ3() {
    const q=exam.q3;
    const typeLabel=q.type==='theory'?'📖 תאוריה':q.type==='express'?'🟢 Express':'Node.js';
    let html=`<div class="q-col">
      <div class="q-type ${q.type}">${typeLabel} — ${q.pts} נק׳</div>
      <div class="q-title">${q.title}</div>
      <div class="sec">🛣 Routes / דרישות</div>`;
    q.routes.forEach(r=>{
      html+=`<div class="item">${r}</div>`;
    });
    html+=`<div class="sec">📦 Data</div>
      <div class="item">${q.data}</div>
      <div class="sec good">✦ נקודה קריטית</div>
      <div class="item good">${q.key}</div>`;
    if(q.bugs&&q.bugs.length){
      html+=`<div class="bug-box"><div class="bug-title">⚠ באגים נפוצים</div>`;
      q.bugs.forEach(b=>{ html+=`<div class="item critical">${b}</div>`; });
      html+=`</div>`;
    }
    html+=`</div>`;
    return html;
  }

  return `<div class="exam-sheet" data-exam="${exam.id}" id="sheet-${exam.id}">
    <div class="exam-head">
      <span>${exam.icon} ${exam.title}</span>
      <span class="pts">💯 סה״כ: ${exam.totalPts} נקודות</span>
    </div>
    <div class="exam-body">
      ${renderQ1()}
      ${renderQ2()}
      ${renderQ3()}
    </div>
  </div>`;
}

function render() {
  document.getElementById('main').innerHTML = EXAMS.map(renderExam).join('');
}

function selectExam(id) {
  document.querySelectorAll('.exam-sheet').forEach(s=>{
    s.classList.toggle('hidden', id!=='all' && s.dataset.exam!==id);
  });
  document.getElementById('exam-select').value = id;
}

render();
</script>
