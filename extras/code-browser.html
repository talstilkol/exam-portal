<style>
:root{--bg:#f4f7fb;--ink:#0f172a;--card:#fff;--border:#0f172a;--brand:#7c3aed;--gold:#facc15;--shadow:5px 5px 0 #0f172a}
*{box-sizing:border-box;margin:0}
body{font-family:'Heebo',Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.hero{background:linear-gradient(135deg,#020617,#1e1b4b 50%,#7c3aed);color:#fff;padding:28px 24px;border-bottom:4px solid #000;text-align:center}
.hero h1{font-size:clamp(22px,4vw,36px);margin:0}
.hero p{color:#dbeafe;margin:6px 0 0;font-size:14px}
.stats{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap}
.stat{background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.2);border-radius:10px;padding:6px 14px;font-weight:900;font-size:13px}
.stat b{color:var(--gold)}
.app{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 160px)}
@media(max-width:768px){.app{grid-template-columns:1fr}}
.sidebar{background:#fff;border-left:3px solid #000;padding:12px;overflow-y:auto;max-height:calc(100vh - 160px);position:sticky;top:0}
.sb-group{margin-bottom:8px}
.sb-title{font-weight:900;font-size:13px;padding:6px 8px;background:linear-gradient(135deg,#111827,#312e81);color:#fff;border-radius:8px;margin-bottom:4px;display:flex;align-items:center;gap:6px}
.sb-btn{display:flex;align-items:center;gap:6px;width:100%;border:2px solid transparent;border-radius:8px;padding:6px 10px;background:none;cursor:pointer;font:inherit;font-size:12px;font-weight:700;text-align:right;transition:.15s}
.sb-btn:hover{background:#f1f5f9;border-color:#cbd5e1}
.sb-btn.active{background:var(--gold);border-color:#000;box-shadow:2px 2px 0 #000}
.sb-icon{font-size:14px;min-width:18px;text-align:center}
.sb-type{margin-right:auto;font-size:10px;color:#64748b;font-weight:800;padding:2px 6px;background:#f1f5f9;border-radius:4px}
.main{padding:20px;overflow-y:auto;max-height:calc(100vh - 160px)}
.file-tabs{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:14px;padding:8px;background:#020617;border:2.5px solid #000;border-radius:12px}
.file-tab{padding:6px 12px;background:#1e293b;color:#94a3b8;border:2px solid #334155;border-radius:8px;cursor:pointer;font:inherit;font-weight:800;font-size:11px;transition:.15s;direction:ltr}
.file-tab:hover{background:#334155;color:#fff}
.file-tab.active{background:var(--gold);color:#000;border-color:#000}
.code-wrap{background:#0f172a;border:3px solid #000;border-radius:16px;overflow:hidden;box-shadow:var(--shadow)}
.code-header{padding:10px 14px;background:#1e293b;border-bottom:2px solid #000;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.code-filename{color:var(--gold);font-weight:900;font-size:14px;direction:ltr;font-family:Consolas,'Courier New',monospace}
.code-meta{color:#94a3b8;font-size:11px;font-weight:600;margin-right:auto}
.code-copy{background:var(--brand);color:#fff;border:2px solid #000;border-radius:8px;padding:4px 12px;font-weight:900;font-size:12px;cursor:pointer;transition:.15s}
.code-copy:hover{transform:translateY(-1px);box-shadow:2px 2px 0 #000}
.code-body{padding:0;overflow-x:auto;max-height:calc(100vh - 360px);overflow-y:auto}
.code-body pre{margin:0;padding:16px;color:#e2e8f0;font-family:Consolas,'Courier New',monospace;font-size:13px;line-height:1.6;tab-size:2;white-space:pre;counter-reset:line}
.code-body .line{display:block;position:relative;padding-right:50px}
.code-body .line::before{counter-increment:line;content:counter(line);position:absolute;right:0;color:#475569;font-size:11px;width:40px;text-align:left;user-select:none}
.code-body .line:hover{background:rgba(250,204,21,.06)}
.placeholder{text-align:center;padding:80px 20px;color:#94a3b8}
.placeholder .big{font-size:60px;display:block;margin-bottom:12px}
.q-info{background:#fff;border:2.5px solid #000;border-radius:14px;padding:14px 16px;margin-bottom:14px;box-shadow:3px 3px 0 #000}
.q-info h2{font-size:18px;font-weight:900;margin-bottom:4px;display:flex;align-items:center;gap:8px}
.q-badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border:2px solid #000;border-radius:6px;font-weight:900;font-size:11px;box-shadow:1px 1px 0 #000}
.q-badge.react{background:#dbeafe;color:#1e40af}
.q-badge.js{background:#fef9c3;color:#854d0e}
.q-badge.express{background:#d1fae5;color:#065f46}
.q-badge.theory{background:#ede9fe;color:#5b21b6}
.q-desc{font-size:13px;color:#475569;font-weight:600}
.link-bar{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.link-btn{padding:5px 12px;background:var(--brand);color:#fff;border:2px solid #000;border-radius:8px;font-weight:800;font-size:11px;text-decoration:none;transition:.15s;display:inline-flex;align-items:center;gap:4px}
.link-btn:hover{transform:translateY(-1px);box-shadow:2px 2px 0 #000}

.kw{color:#c084fc}.str{color:#86efac}.num{color:#fbbf24}.cm{color:#64748b;font-style:italic}.fn{color:#38bdf8}.op{color:#f472b6}.tag{color:#fb923c}.attr{color:#a78bfa}
.search-bar{display:flex;gap:6px;align-items:center;padding:6px 10px;background:#f1f5f9;border-bottom:2px solid #e2e8f0}
.search-bar input{flex:1;border:2px solid #cbd5e1;border-radius:8px;padding:5px 10px;font:inherit;font-size:12px;font-weight:600;outline:none;transition:.15s}
.search-bar input:focus{border-color:var(--brand);box-shadow:0 0 0 2px rgba(124,58,237,.15)}

.code-body .line.hl{background:rgba(250,204,21,.25)!important}
@media print{.sidebar{display:none}.app{grid-template-columns:1fr}.hero{padding:12px}.code-body{max-height:none;overflow:visible}}
</style>

const TYPE_ICONS={react:'⚛️',js:'🟨',express:'🟢',theory:'📖'};
let activeQid=null, activeFileIdx=0;

function buildSidebar(){
  const sb=document.getElementById('sidebar');
  let html='';
  SYSTEMS.forEach(sys=>{
    html+=`<div class="sb-group"><div class="sb-title">${sys.icon} ${sys.name}</div>`;
    sys.questions.forEach(q=>{
      html+=`<button class="sb-btn" data-qid="${q.id}" onclick="selectQ('${q.id}')">
        <span class="sb-icon">${TYPE_ICONS[q.type]||''}</span>${q.label}
        <span class="sb-type">${q.files.length} files</span>
      </button>`;
    });
    html+=`</div>`;
  });
  sb.innerHTML=html;
}

function findQ(qid){
  for(const sys of SYSTEMS) for(const q of sys.questions) if(q.id===qid) return {sys,q};
  return null;
}

function selectQ(qid){
  activeQid=qid;
  activeFileIdx=0;
  document.querySelectorAll('.sb-btn').forEach(b=>b.classList.toggle('active',b.dataset.qid===qid));
  const viewed=JSON.parse(localStorage.getItem('cb-viewed')||'[]');
  if(!viewed.includes(qid)){viewed.push(qid);localStorage.setItem('cb-viewed',JSON.stringify(viewed));}
  loadFile();
}

async function loadFile(){
  const found=findQ(activeQid);
  if(!found) return;
  const {sys,q}=found;
  const f=q.files[activeFileIdx];
  const main=document.getElementById('main');

  let html=`<div class="q-info"><h2><span class="q-badge ${q.type}">${TYPE_ICONS[q.type]} ${q.type}</span> ${sys.icon} ${sys.name} — ${q.label} <span style="background:#111827;color:var(--gold);padding:2px 8px;border-radius:6px;font-size:12px">${q.pts} נק׳</span></h2>
  <div class="q-desc">${q.desc}</div>
  <div class="link-bar"><a class="link-btn" href="flow-canvas.html#${q.id}">🗺 מפת זרימה</a><a class="link-btn" href="file-graph.html#${q.id.split('-')[0]}">📂 File Graph</a></div></div>`;

  html+=`<div class="file-tabs">`;
  q.files.forEach((fi,i)=>{
    const ext=fi.name.split('.').pop();
    const icon=ext==='jsx'?'⚛️':ext==='js'?'📄':ext==='css'?'🎨':ext==='json'?'📦':ext==='html'?'🌐':'📝';
    html+=`<button class="file-tab${i===activeFileIdx?' active':''}" onclick="activeFileIdx=${i};loadFile()">${icon} ${fi.name}</button>`;
  });
  html+=`</div>`;

  try{
    const resp=await fetch('exported-code/'+f.path);
    let code=await resp.text();
    code=escHtml(code);
    code=highlightSyntax(code,f.lang);
    const lines=code.split('\n').map(l=>`<span class="line">${l}</span>`).join('\n');
    const lineCount=code.split('\n').length;
    html+=`<div class="code-wrap">
      <div class="code-header">
        <span class="code-filename">${f.path}</span>
        <span class="code-meta">${lineCount} lines</span>
        <button class="code-copy" onclick="copyCode()">📋 העתק</button>
      </div>
      <div class="search-bar"><input type="text" id="code-search" placeholder="🔍 חפש בקוד..." oninput="searchInCode(this.value)"><span class="s-count" id="s-count"></span><button onclick="clearSearch()">✕</button></div>
      <div class="code-body"><pre id="code-pre">${lines}</pre></div>
    </div>`;
  } catch(e){
    html+=`<div class="code-wrap"><div class="code-header"><span class="code-filename">${f.path}</span></div><div class="code-body"><pre style="padding:20px;color:#f87171">Error loading file: ${e.message}</pre></div></div>`;
  }
  main.innerHTML=html;
}

function escHtml(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

function highlightSyntax(code,lang){
  if(lang==='json') return code;
  if(lang==='css'){
    code=code.replace(/(\/\*[\s\S]*?\*\/)/g,'<span class="cm">$1</span>');
    code=code.replace(/([{};:])/g,'<span class="op">$1</span>');
    return code;
  }
  if(lang==='txt') return code;
  code=code.replace(/(\/\/.*)/g,'<span class="cm">$1</span>');
  code=code.replace(/(\/\*[\s\S]*?\*\/)/g,'<span class="cm">$1</span>');
  code=code.replace(/\b(const|let|var|function|return|if|else|for|while|switch|case|break|default|new|this|class|extends|import|export|from|async|await|try|catch|throw|typeof|instanceof|of|in)\b/g,'<span class="kw">$1</span>');
  code=code.replace(/(&quot;[^&]*?&quot;|'[^']*?'|`[^`]*?`)/g,'<span class="str">$1</span>');
  code=code.replace(/\b(\d+\.?\d*)\b/g,'<span class="num">$1</span>');
  if(lang==='jsx'||lang==='html'){
    code=code.replace(/(&lt;\/?)([\w.]+)/g,'$1<span class="tag">$2</span>');
    code=code.replace(/\s(className|onClick|onChange|onSubmit|value|style|key|to|path|element|type|placeholder|disabled|checked|required|href|src|id)=/g,' <span class="attr">$1</span>=');
  }
  return code;
}

async function copyCode(){
  const pre=document.getElementById('code-pre');
  if(!pre) return;
  try{
    await navigator.clipboard.writeText(pre.textContent);
    const btn=document.querySelector('.code-copy');
    btn.textContent='✓ הועתק!';
    setTimeout(()=>btn.textContent='📋 העתק',1500);
  }catch(e){}
}

function searchInCode(term){
  const pre=document.getElementById('code-pre');
  const countEl=document.getElementById('s-count');
  if(!pre){return;}
  const lines=pre.querySelectorAll('.line');
  let count=0;
  lines.forEach(line=>{
    if(term&&line.textContent.toLowerCase().includes(term.toLowerCase())){
      line.classList.add('hl');count++;
    }else{line.classList.remove('hl');}
  });
  if(countEl) countEl.textContent=term?`${count} שורות`:'';
  if(count>0){const first=pre.querySelector('.line.hl');if(first)first.scrollIntoView({block:'center',behavior:'smooth'});}
}
function clearSearch(){
  const input=document.getElementById('code-search');
  if(input){input.value='';searchInCode('');}
}

buildSidebar();

if(location.hash){
  const qid=location.hash.slice(1);
  if(findQ(qid)) selectQ(qid);
}
