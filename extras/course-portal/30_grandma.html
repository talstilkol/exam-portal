<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;700;900&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ידע מורחב ברמת סבתא | Full-Stack Portal</title>
<style>
body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; line-height: 1.6; }
header { background: #161b22; padding: 1rem 2rem; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 1rem; position: sticky; top: 0; z-index: 10; }
.back-btn { background: #21262d; border: 1px solid #30363d; color: #8b949e; padding: 0.4rem 0.9rem; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 0.85rem; }
.back-btn:hover { background: #30363d; color: #c9d1d9; }
h1 { font-size: 1.4rem; color: #79c0ff; margin: 0; }
.container { max-width: 1000px; margin: 2rem auto; padding: 0 1rem; }
.intro { text-align: center; margin-bottom: 2rem; }
.intro p { color: #8b949e; font-size: 1.1rem; }

/* Search */
.search-container { margin-bottom: 2rem; position: relative; }
.search-input { width: 100%; padding: 1rem 1rem 1rem 3rem; border-radius: 8px; border: 1px solid #30363d; background: #161b22; color: #c9d1d9; font-size: 1.1rem; outline: none; }
.search-input:focus { border-color: #58a6ff; box-shadow: 0 0 0 3px rgba(88,166,255,0.3); }

/* Sections */
.section { background: #161b22; border: 1px solid #30363d; border-radius: 12px; margin-bottom: 2rem; overflow: hidden; }
.section-header { background: #21262d; padding: 1rem 1.5rem; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 0.8rem; }
.section-header h2 { margin: 0; font-size: 1.2rem; color: #e6edf3; }
.section-desc { color: #8b949e; font-size: 0.9rem; margin-top: 0.2rem; }

/* Terms Grid */
.terms-grid { display: grid; gap: 1px; background: #30363d; }
.term-card { background: #0d1117; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; }
.term-card.hidden { display: none; }
.term-title { font-size: 1.2rem; font-weight: 600; color: #58a6ff; margin-bottom: 0.5rem; display: flex; align-items: baseline; gap: 0.5rem; }
.term-number { font-size: 0.8rem; color: #8b949e; background: #21262d; padding: 0.2rem 0.5rem; border-radius: 10px; }

/* Levels */
.levels { display: flex; flex-direction: column; gap: 0.8rem; }
.level { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 1rem; position: relative; border-right: 4px solid transparent; }
.level.grandma { border-right-color: #3fb950; }
.level.tech { border-right-color: #a371f7; }
.level.expanded { border-right-color: #58a6ff; }
.level-title { font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.5px; font-weight: 700; margin-bottom: 0.4rem; display: flex; align-items: center; gap: 0.4rem; }
.level.grandma .level-title { color: #3fb950; }
.level.tech .level-title { color: #a371f7; }
.level.expanded .level-title { color: #58a6ff; }
.level-content { font-size: 0.95rem; line-height: 1.6; }

@media (min-width: 768px) {
  .levels { flex-direction: row; align-items: stretch; }
  .level { flex: 1; display: flex; flex-direction: column; }
  .level-content { flex: 1; }
}

.no-results { text-align: center; padding: 3rem; color: #8b949e; display: none; }
</style>
</head>
<body>

<header>
  <a href="00_dashboard.html" class="back-btn">← חזרה לדשבורד</a>
  <h1>👵 ידע מורחב ברמת סבתא</h1>
</header>

<div class="container">
  <div class="intro" id="intro-container">
    <!-- Populated via JS -->
  </div>

  <div class="search-container">
    <input type="text" id="searchInput" class="search-input" placeholder="חיפוש מונח, טכנולוגיה, או דימוי (למשל: React, שרת, מתכון)...">
  </div>

  <div id="content">
    <!-- Sections populated via JS -->
  </div>
  
  <div id="noResults" class="no-results">
    לא נמצאו מונחים התואמים לחיפוש שלך.
  </div>
</div>

<script src="materials/raw-data/grandma_knowledge.js"></script>
<script>
  const data = typeof GRANDMA_KNOWLEDGE !== 'undefined' ? GRANDMA_KNOWLEDGE : null;
  const contentEl = document.getElementById('content');
  const introEl = document.getElementById('intro-container');
  const searchInput = document.getElementById('searchInput');
  const noResultsEl = document.getElementById('noResults');

  if (data) {
    introEl.innerHTML = `<p>${data.intro.subtitle}</p>`;

    let html = '';
    data.sections.forEach(section => {
      html += `
        <div class="section" id="sec-${section.id}">
          <div class="section-header">
            <span style="font-size: 1.5rem;">${section.icon}</span>
            <div>
              <h2>${section.title}</h2>
              <div class="section-desc">${section.description}</div>
            </div>
          </div>
          <div class="terms-grid">
      `;
      
      section.terms.forEach(term => {
        html += `
            <div class="term-card" data-search="${term.term.toLowerCase()} ${term.grandma.toLowerCase()} ${term.technical.toLowerCase()} ${term.expanded.toLowerCase()}">
              <div class="term-title">
                <span class="term-number">#${term.number}</span>
                ${term.term}
              </div>
              <div class="levels">
                <div class="level grandma">
                  <div class="level-title">👵 הסבר ברמת סבתא</div>
                  <div class="level-content">${term.grandma}</div>
                </div>
                <div class="level tech">
                  <div class="level-title">💻 משמעות טכנית</div>
                  <div class="level-content">${term.technical}</div>
                </div>
                <div class="level expanded">
                  <div class="level-title">🎓 איפה פוגשים את זה?</div>
                  <div class="level-content">${term.expanded}</div>
                </div>
              </div>
            </div>
        `;
      });
      
      html += `
          </div>
        </div>
      `;
    });
    
    contentEl.innerHTML = html;
  } else {
    contentEl.innerHTML = '<div style="color:red; text-align:center; padding: 2rem;">שגיאה: לא ניתן לטעון את הנתונים מקובץ grandma_knowledge.js. ודא שהוא קיים.</div>';
  }

  searchInput.addEventListener('input', (e) => {
    const q = e.target.value.toLowerCase();
    let totalVisible = 0;
    
    document.querySelectorAll('.section').forEach(section => {
      let sectionVisible = 0;
      section.querySelectorAll('.term-card').forEach(card => {
        const text = card.getAttribute('data-search');
        if (text.includes(q)) {
          card.classList.remove('hidden');
          sectionVisible++;
          totalVisible++;
        } else {
          card.classList.add('hidden');
        }
      });
      
      section.style.display = sectionVisible === 0 ? 'none' : 'block';
    });
    
    noResultsEl.style.display = totalVisible === 0 ? 'block' : 'none';
  });
</script>

<script src="../nav-tree.js"></script>
</body>
</html>
