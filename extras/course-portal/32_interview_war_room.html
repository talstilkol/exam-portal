<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>חדר מלחמה לראיונות | Full-Stack Portal</title>
<style>
  body { background: #0d1117; color: #e6edf3; font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; line-height: 1.6; }
  header { background: #161b22; padding: 1.5rem 2rem; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 1rem; position: sticky; top: 0; z-index: 10; box-shadow: 0 4px 15px rgba(0,0,0,0.5); }
  .back-btn { background: #21262d; border: 1px solid #30363d; color: #8b949e; padding: 0.5rem 1rem; border-radius: 6px; cursor: pointer; text-decoration: none; font-size: 0.9rem; transition: 0.2s; }
  .back-btn:hover { background: #30363d; color: #c9d1d9; }
  h1 { font-size: 1.6rem; color: #f85149; margin: 0; }
  
  .container { max-width: 1200px; margin: 2rem auto; padding: 0 1.5rem; }
  
  /* Tabs */
  .tabs { display: flex; gap: 1rem; margin-bottom: 2rem; border-bottom: 1px solid #30363d; padding-bottom: 1rem; overflow-x: auto; }
  .tab { background: #161b22; border: 1px solid #30363d; color: #8b949e; padding: 0.8rem 1.5rem; border-radius: 8px; cursor: pointer; font-weight: 600; white-space: nowrap; transition: 0.2s; }
  .tab:hover { background: #21262d; color: #c9d1d9; }
  .tab.active { background: #1f1117; border-color: #f85149; color: #ff7b72; }
  
  .panel { display: none; }
  .panel.active { display: block; }
  
  /* Cards */
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(350px, 1fr)); gap: 1.5rem; }
  .card { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 1.5rem; display: flex; flex-direction: column; gap: 1rem; position: relative; transition: 0.3s; }
  .card:hover { border-color: #f85149; box-shadow: 0 5px 15px rgba(248,81,73,0.1); transform: translateY(-3px); }
  
  .card-header { display: flex; justify-content: space-between; align-items: flex-start; }
  .category { background: #21262d; color: #58a6ff; font-size: 0.8rem; padding: 0.2rem 0.6rem; border-radius: 12px; font-weight: bold; }
  
  .question-title { font-size: 1.15rem; color: #e6edf3; font-weight: 600; margin: 0.5rem 0; line-height: 1.4; }
  .expected-answer { background: #0d1117; border-right: 4px solid #3fb950; padding: 1rem; border-radius: 6px; font-size: 0.95rem; color: #c9d1d9; display: none; margin-top: auto; }
  
  .reveal-btn { background: #21262d; border: 1px solid #30363d; color: #8b949e; padding: 0.6rem; border-radius: 6px; cursor: pointer; text-align: center; font-weight: bold; width: 100%; transition: 0.2s; margin-top: auto; }
  .reveal-btn:hover { background: #30363d; color: #e6edf3; }
  
  /* War Stories Specifics */
  .story-card { border-right: 4px solid #f85149; }
  .story-title { font-size: 1.2rem; color: #ff7b72; font-weight: bold; margin-bottom: 0.5rem; }
  .story-bug { background: #1f1117; padding: 0.8rem; border-radius: 6px; color: #ff7b72; margin-bottom: 0.5rem; font-size: 0.9rem; }
  .story-fix { background: #112316; padding: 0.8rem; border-radius: 6px; color: #3fb950; display: none; font-size: 0.9rem; margin-bottom: 0.5rem; }
  
  .stats { text-align: center; margin-bottom: 2rem; color: #8b949e; }
  
</style>
</head>
<body>

<header>
  <a href="00_dashboard.html" class="back-btn">← דשבורד</a>
  <h1>⚔️ חדר מלחמה: ראיונות ותרחישי קיצון</h1>
</header>

<div class="container">
  <div class="stats">
    <p>הכנה מנטלית ומקצועית לראיונות Full-Stack — שאלות, סיפורי קרב מהשטח, ותסריטי קיצון.</p>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="switchTab('tab-interviews')">🎙️ שאלות ראיון (Junior/Mid)</button>
    <button class="tab" onclick="switchTab('tab-stories')">🔥 סיפורי קרב (War Stories)</button>
    <button class="tab" onclick="switchTab('tab-whatif')">🤔 שאלות What If</button>
    <button class="tab" onclick="switchTab('tab-scenarios')">🏗️ דילמות ארכיטקטורה (Scenarios)</button>
    <button class="tab" onclick="switchTab('tab-counter')">🔄 Counterfactuals (מה היה קורה אם)</button>
  </div>

  <!-- INTERVIEWS -->
  <div id="tab-interviews" class="panel active">
    <div class="grid" id="grid-interviews"></div>
  </div>

  <!-- WAR STORIES -->
  <div id="tab-stories" class="panel">
    <div class="grid" id="grid-stories"></div>
  </div>

  <!-- WHAT IF -->
  <div id="tab-whatif" class="panel">
    <div class="grid" id="grid-whatif"></div>
  </div>

  <!-- SCENARIOS -->
  <div id="tab-scenarios" class="panel">
    <div class="grid" id="grid-scenarios"></div>
  </div>

  <!-- COUNTERFACTUALS -->
  <div id="tab-counter" class="panel">
    <div class="grid" id="grid-counter"></div>
  </div>

</div>

<!-- Data Scripts -->
<script src="materials/raw-data/interview_prep.js"></script>
<script src="materials/raw-data/war_stories.js"></script>
<script src="materials/raw-data/what_if.js"></script>
<script src="materials/raw-data/scenarios.js"></script>
<script src="materials/raw-data/counterfactuals.js"></script>

<script>
function switchTab(tabId) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  event.currentTarget.classList.add('active');
  document.getElementById(tabId).classList.add('active');
}

function revealAnswer(btn) {
  const answerDiv = btn.previousElementSibling;
  if (answerDiv.style.display === 'block') {
    answerDiv.style.display = 'none';
    btn.textContent = '👀 הצג תשובה / פתרון';
  } else {
    answerDiv.style.display = 'block';
    btn.textContent = '🙈 הסתר תשובה';
  }
}

function renderInterviews() {
  const container = document.getElementById('grid-interviews');
  if (typeof INTERVIEW_PREP === 'undefined') { container.innerHTML = '<p>אין נתונים</p>'; return; }
  
  let html = '';
  INTERVIEW_PREP.forEach(item => {
    html += `
      <div class="card">
        <div class="card-header"><span class="category">${item.category}</span></div>
        <div class="question-title">${item.question}</div>
        <div class="expected-answer">
          <strong>תשובה מצופה:</strong><br>${item.expectedAnswer}<br><br>
          <em style="color:#8b949e;font-size:0.85rem">שאלות המשך (Follow ups):<br> • ${item.followUps?.join('<br> • ')}</em>
        </div>
        <button class="reveal-btn" onclick="revealAnswer(this)">👀 הצג תשובה / פתרון</button>
      </div>
    `;
  });
  container.innerHTML = html;
}

function renderWarStories() {
  const container = document.getElementById('grid-stories');
  if (typeof WAR_STORIES === 'undefined') { container.innerHTML = '<p>אין נתונים</p>'; return; }
  
  let html = '';
  WAR_STORIES.forEach(item => {
    html += `
      <div class="card story-card">
        <div class="story-title">💥 ${item.title}</div>
        <div class="story-bug"><strong>הבאג מ-Production:</strong><br>${item.theBug}</div>
        <div class="expected-answer">
          <strong>החקירה והפתרון:</strong><br>${item.theFix}<br><br>
          <strong style="color:#58a6ff">💡 הלקח:</strong> ${item.theLesson}
        </div>
        <button class="reveal-btn" onclick="revealAnswer(this)">👀 חקור ופתור</button>
      </div>
    `;
  });
  container.innerHTML = html;
}

function renderWhatIf() {
  const container = document.getElementById('grid-whatif');
  if (typeof WHAT_IF === 'undefined') { container.innerHTML = '<p>אין נתונים</p>'; return; }
  
  let html = '';
  WHAT_IF.forEach(item => {
    html += `
      <div class="card">
        <div class="question-title">🤔 מה היה קורה אם...<br>${item.scenario}</div>
        <div class="expected-answer">
          <strong>ההשלכות:</strong><br>${item.consequences}
        </div>
        <button class="reveal-btn" onclick="revealAnswer(this)">👀 גלה את ההשלכות</button>
      </div>
    `;
  });
  container.innerHTML = html;
}

function renderScenarios() {
  const container = document.getElementById('grid-scenarios');
  if (typeof SCENARIOS === 'undefined') { container.innerHTML = '<p>אין נתונים</p>'; return; }
  
  let html = '';
  SCENARIOS.forEach(item => {
    html += `
      <div class="card">
        <div class="card-header"><span class="category">${item.category || 'Architecture'}</span></div>
        <div class="question-title">🏢 דילמה:<br>${item.scenario}</div>
        <div class="expected-answer">
          <strong>איך ניגשים לזה:</strong><br>${item.considerations || item.answer}
        </div>
        <button class="reveal-btn" onclick="revealAnswer(this)">👀 איך בונים את זה?</button>
      </div>
    `;
  });
  container.innerHTML = html;
}

function renderCounterfactuals() {
  const container = document.getElementById('grid-counter');
  if (typeof COUNTERFACTUALS === 'undefined') { container.innerHTML = '<p>אין נתונים</p>'; return; }
  
  let html = '';
  COUNTERFACTUALS.forEach(item => {
    html += `
      <div class="card">
        <div class="question-title">🔄 ${item.whatIf}</div>
        <div class="expected-answer">
          <strong>המציאות החלופית:</strong><br>${item.thenWhat}
        </div>
        <button class="reveal-btn" onclick="revealAnswer(this)">👀 מה היה קורה?</button>
      </div>
    `;
  });
  container.innerHTML = html;
}

// Init
window.onload = () => {
  renderInterviews();
  renderWarStories();
  renderWhatIf();
  renderScenarios();
  renderCounterfactuals();
};
</script>

<script src="../nav-tree.js"></script>
</body>
</html>
