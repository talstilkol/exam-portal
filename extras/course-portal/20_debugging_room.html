<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>🐛 חדר דיבוג: The Bug Hunt</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
    body { background: #0f172a; color: #f8fafc; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
    
    header { text-align: center; margin-bottom: 20px; width: 100%; max-width: 1000px; position: relative; }
    h1 { color: #facc15; font-size: 2.5em; text-shadow: 0 0 10px rgba(250, 204, 21, 0.3); }
    p { color: #94a3b8; font-size: 1.1em; }
    .back-btn { position: absolute; right: 0; top: 0; background: rgba(255,255,255,0.1); color: #fff; text-decoration: none; padding: 8px 15px; border-radius: 8px; font-weight: bold; }
    
    .room-container { background: #1e293b; border: 1px solid #334155; border-radius: 15px; width: 100%; max-width: 1000px; padding: 30px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    
    .scenario-info { margin-bottom: 20px; }
    .scenario-title { font-size: 1.5em; color: #38bdf8; display: flex; justify-content: space-between; align-items: center; }
    .difficulty { background: #dc2626; color: white; padding: 4px 10px; border-radius: 12px; font-size: 0.6em; font-weight: bold; }
    .scenario-desc { color: #cbd5e1; margin-top: 5px; }

    .editor { background: #000; border-radius: 8px; padding: 20px; font-family: 'Fira Code', monospace; font-size: 1.1em; line-height: 1.6; color: #a5b4fc; direction: ltr; text-align: left; position: relative; border: 2px solid #334155; }
    
    .code-line { display: flex; padding: 2px 10px; cursor: pointer; transition: background 0.2s; border-radius: 4px; }
    .code-line:hover { background: rgba(56, 189, 248, 0.2); }
    .code-line.selected { background: rgba(239, 68, 68, 0.3); border-left: 4px solid #ef4444; }
    
    .line-num { color: #64748b; margin-right: 15px; user-select: none; width: 30px; text-align: right; }
    .line-code { white-space: pre; }

    .action-panel { margin-top: 25px; display: flex; flex-direction: column; gap: 15px; }
    .fix-input { width: 100%; background: #0f172a; border: 2px solid #334155; padding: 15px; border-radius: 8px; color: white; font-size: 1.1em; display: none; }
    .fix-input:focus { outline: none; border-color: #38bdf8; }
    
    .btn-container { display: flex; gap: 15px; }
    .btn { padding: 12px 25px; border: none; border-radius: 8px; font-weight: bold; font-size: 1.1em; cursor: pointer; transition: 0.2s; color: white; }
    .btn-submit { background: #10b981; flex: 1; display: none; }
    .btn-submit:hover { background: #059669; }
    .btn-skip { background: rgba(255,255,255,0.1); }
    
    .feedback { margin-top: 20px; padding: 15px; border-radius: 8px; display: none; font-size: 1.1em; }
    .feedback.success { background: rgba(16,185,129,0.2); border: 1px solid #10b981; color: #a7f3d0; }
    .feedback.fail { background: rgba(239,68,68,0.2); border: 1px solid #ef4444; color: #fecaca; }
    
  </style>
</head>
<body>

<header>
  <a href="00_dashboard.html" class="back-btn">← דשבורד</a>
  <h1>🐛 חדר דיבוג (The Bug Hunt)</h1>
  <p>מצא את השורה התקולה והסבר כיצד לתקן אותה</p>
</header>

<div class="room-container">
  <div class="scenario-info">
    <div class="scenario-title">
      <span id="s-title">טוען באג...</span>
      <span class="difficulty" id="s-diff">Hard</span>
    </div>
    <div class="scenario-desc" id="s-desc">תיאור הבאג יופיע כאן...</div>
  </div>

  <div class="editor" id="editor">
    <!-- Lines injected by JS -->
  </div>

  <div class="action-panel">
    <input type="text" id="fix-input" class="fix-input" placeholder="סמנת את שורה X. איך תתקן אותה? (לדוגמה: 'חסר מערך תלויות')">
    <div class="btn-container">
      <button class="btn btn-skip" onclick="nextBug()">דלג על הבאג</button>
      <button class="btn btn-submit" id="btn-submit" onclick="checkBug()">בדוק תיקון ✔️</button>
    </div>
    <div class="feedback" id="feedback"></div>
  </div>
</div>

<script>
  const bugs = [
    {
      title: 'React: The Infinite Loop',
      desc: 'הקומפוננטה קורסת מיד כשהיא נטענת. הדפדפן נתקע.',
      diff: 'Medium',
      code: [
        'function UserProfile() {',
        '  const [user, setUser] = useState(null);',
        '',
        '  useEffect(() => {',
        '    fetchUser().then(data => setUser(data));',
        '  });',
        '',
        '  return <div>{user ? user.name : "Loading..."}</div>;',
        '}'
      ],
      bugLine: 5,
      keywords: ['תלויות', 'ריק', 'dependency', 'array', '[]', 'מערך', 'deps'],
      solution: 'שכחת להוסיף מערך תלויות `[]` ב-useEffect, ולכן הוא רץ שוב אחרי כל רינדור וגורם ללולאה אינסופית.'
    },
    {
      title: 'Node.js: Headers Already Sent',
      desc: 'השרת נופל עם השגיאה: Cannot set headers after they are sent to the client.',
      diff: 'Hard',
      code: [
        'app.post("/login", (req, res) => {',
        '  const { username, password } = req.body;',
        '  if (!username || !password) {',
        '    res.status(400).send("Missing credentials");',
        '  }',
        '',
        '  User.findOne({ username }).then(user => {',
        '    res.send("Logged in!");',
        '  });',
        '});'
      ],
      bugLine: 3, // line 4 in the 1-indexed view
      keywords: ['return', 'להחזיר', 'עוצר', 'ממשיך', 'החזרה'],
      solution: 'חסר `return` לפני `res.status(400)`. השרת שלח שגיאה, אבל המשיך להריץ את הקוד ולנסות לשלוח תשובה נוספת.'
    },
    {
      title: 'JS: The Closure Trap',
      desc: 'הלולאה אמורה להדפיס 0, 1, 2, אבל היא מדפיסה 3, 3, 3.',
      diff: 'Easy',
      code: [
        'function printNumbers() {',
        '  for (var i = 0; i < 3; i++) {',
        '    setTimeout(() => {',
        '      console.log(i);',
        '    }, 1000);',
        '  }',
        '}',
        'printNumbers();'
      ],
      bugLine: 1, // line 2 in the 1-indexed view
      keywords: ['let', 'const', 'block scope', 'בלוק'],
      solution: 'במקום `var` יש להשתמש ב-`let` כדי שניצור Block Scope חדש לכל איטרציה של הלולאה.'
    }
  ];

  let currentBug = null;
  let selectedLine = null;

  function loadBug() {
    selectedLine = null;
    currentBug = bugs[Math.floor(Math.random() * bugs.length)];
    
    document.getElementById('s-title').textContent = currentBug.title;
    document.getElementById('s-diff').textContent = currentBug.diff;
    document.getElementById('s-desc').textContent = currentBug.desc;
    
    const editor = document.getElementById('editor');
    editor.innerHTML = '';
    
    currentBug.code.forEach((line, idx) => {
      const lineDiv = document.createElement('div');
      lineDiv.className = 'code-line';
      lineDiv.dataset.line = idx;
      lineDiv.innerHTML = `<span class="line-num">${idx + 1}</span><span class="line-code">${line}</span>`;
      
      lineDiv.onclick = () => selectLine(lineDiv, idx);
      editor.appendChild(lineDiv);
    });

    document.getElementById('fix-input').style.display = 'none';
    document.getElementById('fix-input').value = '';
    document.getElementById('btn-submit').style.display = 'none';
    document.getElementById('feedback').style.display = 'none';
  }

  function selectLine(element, idx) {
    document.querySelectorAll('.code-line').forEach(el => el.classList.remove('selected'));
    element.classList.add('selected');
    selectedLine = idx;
    
    document.getElementById('fix-input').style.display = 'block';
    document.getElementById('btn-submit').style.display = 'block';
    document.getElementById('fix-input').focus();
  }

  function checkBug() {
    const fb = document.getElementById('feedback');
    const input = document.getElementById('fix-input').value.toLowerCase();
    
    if (selectedLine !== currentBug.bugLine) {
      fb.className = 'feedback fail';
      fb.textContent = '❌ זו לא השורה שגורמת לבאג... חפש שוב.';
      fb.style.display = 'block';
      return;
    }

    let hasKeyword = currentBug.keywords.some(kw => input.includes(kw));
    
    if (hasKeyword) {
      fb.className = 'feedback success';
      fb.innerHTML = `✅ <strong>מעולה! גם מצאת את השורה וגם הבנת את הבעיה.</strong><br><br>הסבר מלא: ${currentBug.solution}`;
      fb.style.display = 'block';
      document.getElementById('btn-submit').style.display = 'none';
      document.getElementById('fix-input').style.display = 'none';
    } else {
      fb.className = 'feedback fail';
      fb.textContent = '⚠️ מצאת את השורה הנכונה, אבל ההסבר או התיקון שהצעת לא מדויקים. חסר מושג מפתח בתיאור שלך.';
      fb.style.display = 'block';
    }
  }

  function nextBug() {
    loadBug();
  }

  // Init
  document.addEventListener('DOMContentLoaded', loadBug);
</script>
<script src="../nav-tree.js"></script>
</body>
</html>
