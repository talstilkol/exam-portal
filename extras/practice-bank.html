<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="description" content="🏋️ Practice Bank — תרגול אינטראקטיבי — פורטל הכנה למבחן Fullstack">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>🏋️ Practice Bank — תרגול אינטראקטיבי</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;700;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f7fb;--ink:#0f172a;--card:#fff;--border:#0f172a;--brand:#7c3aed;--gold:#facc15;--blue:#2563eb;--green:#16a34a;--orange:#f97316;--red:#dc2626;--shadow:5px 5px 0 #0f172a}
*{box-sizing:border-box;margin:0}
body{font-family:'Heebo',Arial,sans-serif;background:var(--bg);color:var(--ink);line-height:1.6}
.hero{background:linear-gradient(135deg,#020617,#1e1b4b 50%,#7c3aed);color:#fff;padding:28px 24px;border-bottom:4px solid #000;text-align:center}
.hero h1{font-size:clamp(24px,4vw,38px);margin:0}
.hero p{color:#dbeafe;margin:6px 0 0;font-size:15px}
.hero .stats{display:flex;gap:12px;justify-content:center;margin-top:10px;flex-wrap:wrap}
.hero .stat{background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.2);border-radius:10px;padding:4px 12px;font-size:13px;font-weight:700}
.app{display:grid;grid-template-columns:240px 1fr;min-height:calc(100vh - 140px)}
.sidebar{background:#fff;border-left:3px solid #000;padding:12px;overflow-y:auto;max-height:calc(100vh - 140px);position:sticky;top:0}
.sb-group{margin-bottom:10px}
.sb-title{font-weight:900;font-size:13px;padding:5px 8px;border-radius:8px;margin-bottom:4px;display:flex;align-items:center;gap:4px}
.sb-title.react{background:#dbeafe;color:#1e40af}
.sb-title.js{background:#fef9c3;color:#854d0e}
.sb-title.express{background:#d1fae5;color:#065f46}
.sb-btn{display:flex;align-items:center;gap:6px;width:100%;border:2px solid transparent;border-radius:8px;padding:6px 10px;background:none;cursor:pointer;font:inherit;font-size:12px;font-weight:700;text-align:right;transition:.15s}
.sb-btn:hover{background:#f1f5f9;border-color:#cbd5e1}
.sb-btn.active{background:var(--gold);border-color:#000;box-shadow:2px 2px 0 #000}
.sb-btn .check{margin-right:auto;font-size:14px}
.sb-btn .diff-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0}
.sb-btn .diff-dot.easy{background:var(--green)}
.sb-btn .diff-dot.medium{background:var(--orange)}
.sb-btn .diff-dot.hard{background:var(--red)}
.filter-bar{display:flex;gap:6px;padding:8px;flex-wrap:wrap;border-bottom:2px solid #e2e8f0;margin-bottom:8px}
.filter-chip{border:2px solid #cbd5e1;border-radius:8px;padding:3px 10px;font-size:11px;font-weight:800;cursor:pointer;transition:.15s;background:#f8fafc}
.filter-chip:hover{border-color:#000;background:#f1f5f9}
.filter-chip.active{background:var(--gold);border-color:#000;box-shadow:2px 2px 0 #000}
.sb-btn.hidden{display:none}
.main{padding:24px;overflow-y:auto;max-height:calc(100vh - 140px)}
.placeholder{text-align:center;padding:80px 20px;color:#64748b}
.placeholder .big{font-size:60px;display:block;margin-bottom:12px}

/* Exercise */
.ex-header{margin-bottom:16px}
.ex-badge{display:inline-flex;align-items:center;gap:4px;padding:4px 10px;border:2px solid #000;border-radius:8px;font-weight:900;font-size:12px;box-shadow:2px 2px 0 #000}
.ex-badge.easy{background:#d1fae5;color:#065f46}
.ex-badge.medium{background:#fef9c3;color:#854d0e}
.ex-badge.hard{background:#fee2e2;color:#991b1b}
.ex-title{font-size:22px;font-weight:900;margin-top:8px}
.ex-desc{color:#475569;font-size:14px;margin-top:4px;line-height:1.7}

/* Code editor */
.editor-wrap{background:#0f172a;border:3px solid #000;border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin:16px 0}
.editor-bar{display:flex;align-items:center;padding:8px 12px;background:#1e293b;border-bottom:2px solid #334155;gap:8px}
.editor-bar .dot{width:10px;height:10px;border-radius:50%;border:1px solid #475569}
.dot-r{background:#ef4444}.dot-y{background:#facc15}.dot-g{background:#22c55e}
.editor-bar .fname{color:#64748b;font-size:12px;font-weight:700;margin-right:auto}
.editor-area{min-height:200px;padding:14px;font-family:Consolas,'Courier New',monospace;font-size:14px;color:#e2e8f0;line-height:1.6;direction:ltr;text-align:left;outline:none;white-space:pre-wrap;tab-size:2;background:#0f172a}
.editor-area:focus{box-shadow:inset 0 0 0 2px var(--brand)}

/* Controls */
.ex-controls{display:flex;gap:8px;margin:14px 0;flex-wrap:wrap}
.ex-btn{border:2px solid #000;border-radius:10px;padding:8px 16px;font-weight:900;font-size:13px;cursor:pointer;box-shadow:2px 2px 0 #000;transition:.15s;display:inline-flex;align-items:center;gap:6px}
.ex-btn:hover{transform:translateY(-2px);box-shadow:3px 4px 0 #000}
.ex-btn.run{background:var(--green);color:#fff}
.ex-btn.hint{background:var(--orange);color:#fff}
.ex-btn.solution{background:var(--brand);color:#fff}
.ex-btn.reset{background:#334155;color:#e2e8f0}

/* Output */
.output-wrap{background:var(--card);border:3px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:var(--shadow);margin:14px 0}
.output-head{padding:8px 12px;font-weight:900;font-size:13px;border-bottom:2px solid var(--border);display:flex;align-items:center;gap:6px}
.output-head.pass{background:#d1fae5;color:#065f46}
.output-head.fail{background:#fee2e2;color:#991b1b}
.output-head.neutral{background:#f1f5f9;color:#475569}
.output-body{padding:12px;font-family:Consolas,monospace;font-size:13px;direction:ltr;text-align:left;max-height:300px;overflow-y:auto;white-space:pre-wrap}
.test-row{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px solid #e2e8f0;font-size:13px}
.test-row:last-child{border:none}
.test-pass{color:var(--green);font-weight:900}
.test-fail{color:var(--red);font-weight:900}

/* Hint */
.hint-box{background:#fffbeb;border:2px solid var(--orange);border-radius:12px;padding:12px;margin:10px 0;font-size:13px;font-weight:600;display:none}
.hint-box.visible{display:block}
.hint-box::before{content:'💡 רמז: '}

/* Solution */
.solution-box{background:#f0fdf4;border:2px solid var(--green);border-radius:12px;margin:10px 0;display:none;overflow:hidden}
.solution-box.visible{display:block}
.solution-head{background:var(--green);color:#fff;padding:8px 12px;font-weight:900;font-size:13px}
.solution-code{direction:ltr;text-align:left;background:#0f172a;color:#e2e8f0;padding:12px;font-family:Consolas,monospace;font-size:13px;line-height:1.5}
.solution-explain{padding:10px 12px;font-size:13px;font-weight:600;line-height:1.7}

/* Dark mode */
@media(prefers-color-scheme:dark){
  :root{--bg:#0f172a;--ink:#e2e8f0;--card:#1e293b;--border:#334155;--shadow:5px 5px 0 #000}
  body{background:var(--bg)}
  .sidebar{background:#1e293b;border-color:#334155}
  .sb-btn:hover{background:#334155}
  .output-body{color:#e2e8f0}
  .hint-box{background:#422006;border-color:var(--orange);color:#fde68a}
  .solution-box{background:#1e293b;border-color:var(--green)}
  .solution-explain{color:#e2e8f0}
  .test-row{border-color:#334155}
  .ex-desc{color:#cbd5e1}
  .output-head.neutral{color:#cbd5e1}
  .editor-area{background:#0f172a;color:#e2e8f0;border-color:#334155}
  .filter-chip{background:#334155;border-color:#475569;color:#e2e8f0}
  .filter-chip.active{background:var(--brand);color:#fff}
}
@media(max-width:768px){
  .app{grid-template-columns:1fr}
  .sidebar{max-height:none;position:static;border-left:none;border-bottom:3px solid #000;display:flex;flex-wrap:wrap;gap:4px;padding:8px}
  .main{max-height:none}
}
@media print{
  body{background:#fff!important;color:#000!important}
  .hero{padding:12px!important;background:#333!important;-webkit-print-color-adjust:exact}
  .sidebar{display:none}
  .app{grid-template-columns:1fr!important}
}
button:focus-visible,a:focus-visible{outline:3px solid #facc15;outline-offset:2px}
.skip-link{position:absolute;top:-40px;left:0;background:#facc15;color:#000;padding:8px 16px;z-index:9999;font-weight:900;border-radius:0 0 8px 0;transition:.2s}.skip-link:focus{top:0}
</style>
</head>
<body>
<a href="#main-content" class="skip-link">דלג לתוכן</a>
<header class="hero">
  <h1>🏋️ Practice Bank — תרגול אינטראקטיבי</h1>
  <p>כתבו קוד, הריצו, קבלו פידבק מיידי. 60 תרגילים בדרגות קושי משתנות.</p>
  <div class="stats">
    <span class="stat" id="stat-solved">✅ נפתרו: 0/60</span>
    <span class="stat" id="stat-streak">🔥 רצף: 0</span>
  </div>
</header>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main">
    <div class="placeholder"><span class="big">👈</span><h2>בחרו תרגיל מהתפריט</h2><p>כתבו את הפתרון, הריצו ובדקו.</p></div>
  </main>
</div>
<script>
const EXERCISES = [
{
  id:"sum-digits",cat:"js",diff:"easy",title:"סכום ספרות",
  desc:"כתבו פונקציה <code>sumDigits(n)</code> שמקבלת מספר שלם ומחזירה את סכום הספרות שלו.\nטפלו במספרים שליליים (התעלמו מהסימן).",
  starter:"function sumDigits(n) {\n  // הקוד שלכם כאן\n  \n}",
  tests:[
    {input:[123],expected:6,label:"sumDigits(123) → 6"},
    {input:[0],expected:0,label:"sumDigits(0) → 0"},
    {input:[-456],expected:15,label:"sumDigits(-456) → 15"},
    {input:[9],expected:9,label:"sumDigits(9) → 9"},
    {input:[1000],expected:1,label:"sumDigits(1000) → 1"}
  ],
  hint:"השתמשו ב-Math.abs כדי להתעלם מסימן שלילי, ואז String().split('') כדי לפרק לספרות.",
  solution:"function sumDigits(n) {\n  return String(Math.abs(n))\n    .split('')\n    .reduce((sum, d) => sum + Number(d), 0);\n}",
  explain:"ממירים למחרוזת (בלי סימן), מפרקים לתווים, ממירים כל אחד למספר וסוכמים עם reduce."
},
{
  id:"unique-chars",cat:"js",diff:"easy",title:"תווים ייחודיים",
  desc:"כתבו פונקציה <code>uniqueChars(str)</code> שמחזירה מחרוזת עם תווים ייחודיים בלבד (ללא כפולים), לפי סדר הופעה.",
  starter:"function uniqueChars(str) {\n  // הקוד שלכם כאן\n  \n}",
  tests:[
    {input:["hello"],expected:"helo",label:'uniqueChars("hello") → "helo"'},
    {input:["aabbcc"],expected:"abc",label:'uniqueChars("aabbcc") → "abc"'},
    {input:[""],expected:"",label:'uniqueChars("") → ""'},
    {input:["abcabc"],expected:"abc",label:'uniqueChars("abcabc") → "abc"'}
  ],
  hint:"השתמשו ב-Set כדי לעקוב אחרי תווים שכבר ראיתם, או [...new Set(str)].join('').",
  solution:"function uniqueChars(str) {\n  return [...new Set(str)].join('');\n}",
  explain:"Set שומר רק ערכים ייחודיים. פריסה למערך עם spread ואז join חזרה למחרוזת."
},
{
  id:"flatten-array",cat:"js",diff:"medium",title:"שטיחת מערך",
  desc:"כתבו פונקציה <code>flatten(arr)</code> שמקבלת מערך מקונן (מערכים בתוך מערכים) ומחזירה מערך שטוח.\nלא להשתמש ב-flat()!",
  starter:"function flatten(arr) {\n  // הקוד שלכם כאן\n  // אל תשתמשו ב-.flat()\n  \n}",
  tests:[
    {input:[[[1,2,[3,4]]]],expected:[1,2,3,4],label:"flatten([1,2,[3,4]]) → [1,2,3,4]"},
    {input:[[[1,[2,[3]]]]],expected:[1,2,3],label:"flatten([1,[2,[3]]]) → [1,2,3]"},
    {input:[[]],expected:[],label:"flatten([]) → []"},
    {input:[[1,2,3]],expected:[1,2,3],label:"flatten([1,2,3]) → [1,2,3]"}
  ],
  hint:"רקורסיה: אם האיבר הוא מערך — קראו ל-flatten עליו. אם לא — דחפו לתוצאה.",
  solution:"function flatten(arr) {\n  const result = [];\n  for (const item of arr) {\n    if (Array.isArray(item)) {\n      result.push(...flatten(item));\n    } else {\n      result.push(item);\n    }\n  }\n  return result;\n}",
  explain:"רקורסיה: עוברים על כל איבר. אם הוא מערך — קוראים ל-flatten ופורסים את התוצאה. אם לא — פשוט מוסיפים."
},
{
  id:"count-words",cat:"js",diff:"easy",title:"ספירת מילים",
  desc:"כתבו פונקציה <code>countWords(str)</code> שמחזירה אובייקט שסופר כמה פעמים כל מילה מופיעה (case insensitive).",
  starter:"function countWords(str) {\n  // הקוד שלכם כאן\n  \n}",
  tests:[
    {input:["hello world hello"],expected:{hello:2,world:1},label:'countWords("hello world hello")'},
    {input:["A a A"],expected:{a:3},label:'countWords("A a A") → {a:3}'},
    {input:[""],expected:{},label:'countWords("") → {}'},
    {input:["one"],expected:{one:1},label:'countWords("one") → {one:1}'}
  ],
  hint:"פצלו עם split(' '), המירו ל-lowercase, ובנו אובייקט: obj[word] = (obj[word]||0) + 1.",
  solution:"function countWords(str) {\n  if (!str.trim()) return {};\n  const result = {};\n  for (const word of str.toLowerCase().split(/\\s+/)) {\n    result[word] = (result[word] || 0) + 1;\n  }\n  return result;\n}",
  explain:"toLowerCase להשוואה case-insensitive, split(/\\s+/) לפיצול לפי רווחים (כולל מרובים), ואז צבירה באובייקט."
},
{
  id:"validate-email",cat:"react",diff:"medium",title:"ולידציית אימייל",
  desc:"כתבו פונקציה <code>validateForm(form)</code> שמקבלת אובייקט {name, email, password} ומחזירה אובייקט שגיאות.\nname: 2+ תווים. email: מכיל @ ונקודה אחריו. password: 8+ תווים, לפחות אות גדולה ומספר.",
  starter:"function validateForm(form) {\n  const errors = {};\n  // הקוד שלכם כאן\n  \n  return errors;\n}",
  tests:[
    {input:[{name:"",email:"bad",password:"123"}],expected:{name:"שם חייב להיות 2+ תווים",email:"אימייל לא תקין",password:"סיסמה: 8+ תווים, אות גדולה ומספר"},label:"all invalid"},
    {input:[{name:"Tal",email:"tal@test.com",password:"Abc12345"}],expected:{},label:"all valid → {}"},
    {input:[{name:"T",email:"a@b.c",password:"Abc12345"}],expected:{name:"שם חייב להיות 2+ תווים"},label:"only name invalid"},
    {input:[{name:"Tal",email:"nope",password:"abcdefgh"}],expected:{email:"אימייל לא תקין",password:"סיסמה: 8+ תווים, אות גדולה ומספר"},label:"email+password invalid"}
  ],
  hint:"לאימייל: בדקו str.includes('@') && str.indexOf('.', str.indexOf('@')) > -1. לסיסמה: /[A-Z]/ && /\\d/ && length >= 8.",
  solution:"function validateForm(form) {\n  const errors = {};\n  if (form.name.length < 2)\n    errors.name = 'שם חייב להיות 2+ תווים';\n  if (!form.email.includes('@') ||\n      form.email.indexOf('.', form.email.indexOf('@')) === -1)\n    errors.email = 'אימייל לא תקין';\n  if (form.password.length < 8 ||\n      !/[A-Z]/.test(form.password) ||\n      !/\\d/.test(form.password))\n    errors.password = 'סיסמה: 8+ תווים, אות גדולה ומספר';\n  return errors;\n}",
  explain:"כל ולידציה — if שבודק תנאי ומוסיף שגיאה לאובייקט. אם אין שגיאות — מוחזר אובייקט ריק {}."
},
{
  id:"group-by",cat:"js",diff:"medium",title:"קיבוץ לפי מפתח",
  desc:"כתבו פונקציה <code>groupBy(arr, key)</code> שמקבצת מערך אובייקטים לפי ערך של שדה מסוים.\nדוגמה: groupBy([{type:'a',v:1},{type:'b',v:2},{type:'a',v:3}], 'type') → {a:[...], b:[...]}",
  starter:"function groupBy(arr, key) {\n  // הקוד שלכם כאן\n  \n}",
  tests:[
    {input:[[{type:"a",v:1},{type:"b",v:2},{type:"a",v:3}],"type"],expected:{a:[{type:"a",v:1},{type:"a",v:3}],b:[{type:"b",v:2}]},label:"group by type"},
    {input:[[{age:20,n:"A"},{age:30,n:"B"},{age:20,n:"C"}],"age"],expected:{"20":[{age:20,n:"A"},{age:20,n:"C"}],"30":[{age:30,n:"B"}]},label:"group by age"},
    {input:[[],"x"],expected:{},label:"empty array → {}"}
  ],
  hint:"עברו על כל איבר, שלפו את הערך של ה-key, ואם אין מערך לערך הזה — צרו אחד ריק, ואז push.",
  solution:"function groupBy(arr, key) {\n  const result = {};\n  for (const item of arr) {\n    const k = item[key];\n    if (!result[k]) result[k] = [];\n    result[k].push(item);\n  }\n  return result;\n}",
  explain:"לכל איבר — מפתח = item[key]. אם לא קיים באובייקט התוצאה — יוצרים מערך ריק. push לתוכו."
},
{
  id:"debounce",cat:"react",diff:"hard",title:"Debounce פונקציה",
  desc:"כתבו פונקציה <code>debounce(fn, delay)</code> שמחזירה פונקציה חדשה.\nהפונקציה החדשה מפעילה את fn רק אחרי שעבר delay מילישניות ללא קריאה נוספת.",
  starter:"function debounce(fn, delay) {\n  // הקוד שלכם כאן\n  \n}",
  tests:[
    {input:["__custom__"],expected:"__custom__",label:"debounce returns a function"},
    {input:["__custom__"],expected:"__custom__",label:"uses clearTimeout + setTimeout"},
    {input:["__custom__"],expected:"__custom__",label:"returned function forwards arguments"},
    {input:["__custom__"],expected:"__custom__",label:"uses closure for timer variable"}
  ],
  customTest(code) {
    const results = [];
    // Test 1: returns a function
    try {
      const fn = new Function(code + "\nreturn debounce;")();
      const debounced = fn(() => {}, 100);
      const pass = typeof debounced === 'function';
      results.push({pass, message: pass ? 'debounce returns a function' : 'debounce should return a function, got: ' + typeof debounced});
    } catch(e) { results.push({pass:false, message:'Error: ' + e.message}); }
    // Test 2: uses clearTimeout + setTimeout
    try {
      const usesClear = /clearTimeout/.test(code);
      const usesSet = /setTimeout/.test(code);
      const pass = usesClear && usesSet;
      results.push({pass, message: pass ? 'uses clearTimeout + setTimeout' : 'must use both clearTimeout and setTimeout'});
    } catch(e) { results.push({pass:false, message:'Error: ' + e.message}); }
    // Test 3: returned function forwards arguments
    try {
      const pass = /\.\.\.args|\.\.\.a|\.\.\.arg|arguments/.test(code) || /apply\s*\(|call\s*\(/.test(code);
      results.push({pass, message: pass ? 'returned function forwards arguments' : 'returned function should forward arguments using ...args or apply/call'});
    } catch(e) { results.push({pass:false, message:'Error: ' + e.message}); }
    // Test 4: uses closure for timer variable
    try {
      const usesLet = /let\s+\w+/.test(code.split('return')[0] || code);
      const usesVar = /var\s+\w+/.test(code.split('return')[0] || code);
      const pass = usesLet || usesVar;
      results.push({pass, message: pass ? 'uses closure for timer variable' : 'should declare a timer variable (let/var) in the closure scope'});
    } catch(e) { results.push({pass:false, message:'Error: ' + e.message}); }
    return results;
  },
  hint:"שמרו timerId במשתנה חיצוני. בכל קריאה — clearTimeout ואז setTimeout חדש.",
  solution:"function debounce(fn, delay) {\n  let timerId;\n  return function(...args) {\n    clearTimeout(timerId);\n    timerId = setTimeout(() => fn(...args), delay);\n  };\n}",
  explain:"closure שומר את timerId. כל קריאה מבטלת את הtimeout הקודם ומתחילה חדש. רק הקריאה האחרונה מתבצעת."
},
{
  id:"express-route",cat:"express",diff:"easy",title:"Express Route — GET all",
  desc:'השלימו את ה-route handler כך ש-<code>GET /items</code> יחזיר את כל הפריטים כ-JSON.',
  starter:"// items is an array defined above\n\napp.get('/items', (req, res) => {\n  // השלימו את הקוד\n  \n});",
  tests:[
    {input:["__custom__"],expected:"__custom__",label:"uses app.get with '/items' route"},
    {input:["__custom__"],expected:"__custom__",label:"calls res.json(items)"},
    {input:["__custom__"],expected:"__custom__",label:"has (req, res) parameters"}
  ],
  customTest(code) {
    const results = [];
    // Test 1: uses app.get with '/items'
    const hasGet = /app\.get\s*\(\s*['"`]\/items['"`]/.test(code);
    results.push({pass: hasGet, message: hasGet ? "uses app.get with '/items' route" : "should use app.get('/items', ...)"});
    // Test 2: calls res.json(items)
    const hasResJson = /res\.json\s*\(\s*items\s*\)/.test(code);
    results.push({pass: hasResJson, message: hasResJson ? "calls res.json(items)" : "should call res.json(items) to return the items array"});
    // Test 3: has (req, res) parameters
    const hasParams = /\(\s*(req|request)\s*,\s*(res|response)\s*\)/.test(code);
    results.push({pass: hasParams, message: hasParams ? "has (req, res) parameters" : "route handler should have (req, res) parameters"});
    return results;
  },
  hint:"השתמשו ב-res.json(items) כדי לשלוח את המערך כ-JSON.",
  solution:"app.get('/items', (req, res) => {\n  res.json(items);\n});",
  explain:"res.json() שולח את הנתונים כ-JSON עם Content-Type: application/json. status 200 הוא ברירת מחדל."
},
{
  id:"express-post",cat:"express",diff:"medium",title:"Express Route — POST + 201",
  desc:'השלימו את ה-route handler כך ש-<code>POST /items</code> יוסיף פריט חדש ויחזיר 201.',
  starter:"app.post('/items', (req, res) => {\n  // 1. קחו name ו-price מ-req.body\n  // 2. צרו אובייקט עם id ייחודי\n  // 3. דחפו למערך items\n  // 4. החזירו 201 עם הפריט\n  \n});",
  tests:[

    {input:["__custom__"],expected:"__custom__",label:"reads from req.body"},
    {input:["__custom__"],expected:"__custom__",label:"pushes new item to items array"},
    {input:["__custom__"],expected:"__custom__",label:"returns status 201 with JSON"}
  ],
  customTest(code) {
    const results = [];
    // Test 1: uses app.post with '/items'
    const hasPost = /app\.post\s*\(\s*['"`]\/items['"`]/.test(code);
    results.push({pass: hasPost, message: hasPost ? "uses app.post with '/items' route" : "should use app.post('/items', ...)"});
    // Test 2: reads from req.body
    const hasReqBody = /req\.body/.test(code);
    results.push({pass: hasReqBody, message: hasReqBody ? "reads from req.body" : "should read data from req.body (e.g., req.body.name, req.body.price)"});
    // Test 3: pushes to items array
    const hasPush = /items\.push\s*\(/.test(code) || /\.push\s*\(\s*(new)?.*item/i.test(code);
    results.push({pass: hasPush, message: hasPush ? "pushes new item to items array" : "should push the new item to the items array using items.push(...)"});

  hint:"const item = {id: Date.now(), ...req.body}; items.push(item); res.status(201).json(item);",
  solution:"app.post('/items', (req, res) => {\n  const item = {\n    id: Date.now(),\n    name: req.body.name,\n    price: req.body.price\n  };\n  items.push(item);\n  res.status(201).json(item);\n});",

{
  id:"mongoose-filter",cat:"express",diff:"medium",title:"Mongoose Filter — AND logic",
  desc:'השלימו את ה-route handler כך ש-<code>POST /filter</code> יסנן לפי כל הפרמטרים שנשלחו (AND logic).',
  starter:"app.post('/filter', async (req, res) => {\n  let filtered = [...games];\n  // סננו לפי: req.body.yearMin, req.body.name, req.body.priceMax\n  // AND logic = כל filter מצמצם את התוצאה\n  \n  res.json(filtered);\n});",
  tests:[
    {input:["__custom__"],expected:"__custom__",label:"filters by yearMin using >= comparison"},
    {input:["__custom__"],expected:"__custom__",label:"filters by name (case-insensitive)"},
    {input:["__custom__"],expected:"__custom__",label:"filters by priceMax using <= comparison"},
    {input:["__custom__"],expected:"__custom__",label:"uses conditional checks (if) before each filter"},
    {input:["__custom__"],expected:"__custom__",label:"sends result with res.json"}
  ],
  customTest(code) {
    const results = [];
    // Test 1: filters by yearMin
    const hasYearMin = /req\.body\.yearMin/.test(code) && /\.filter\s*\(/.test(code) && /year\s*>=/.test(code);
    results.push({pass: hasYearMin, message: hasYearMin ? "filters by yearMin using >= comparison" : "should filter by req.body.yearMin with g.year >= req.body.yearMin"});
    // Test 2: filters by name (case-insensitive)
    const hasName = /req\.body\.name/.test(code) && (/toLowerCase|toLocaleLowerCase/.test(code) || /includes/.test(code));
    results.push({pass: hasName, message: hasName ? "filters by name (case-insensitive)" : "should filter by req.body.name using toLowerCase() and includes()"});
    // Test 3: filters by priceMax
    const hasPriceMax = /req\.body\.priceMax/.test(code) && /price\s*<=/.test(code);
    results.push({pass: hasPriceMax, message: hasPriceMax ? "filters by priceMax using <= comparison" : "should filter by req.body.priceMax with g.price <= req.body.priceMax"});
    // Test 4: uses conditional checks
    const ifCount = (code.match(/if\s*\(\s*req\.body\./g) || []).length;
    const pass4 = ifCount >= 2;
    results.push({pass: pass4, message: pass4 ? "uses conditional checks (if) before each filter" : "should use if(req.body.xxx) before each .filter() to skip unused params"});
    // Test 5: sends result with res.json
    const hasResJson = /res\.json\s*\(\s*(filtered|results?|data|games)/.test(code);
    results.push({pass: hasResJson, message: hasResJson ? "sends result with res.json" : "should send the filtered result with res.json(filtered)"});
    return results;
  },
  hint:"if (req.body.yearMin) filtered = filtered.filter(g => g.year >= req.body.yearMin); חזרו על זה לכל פרמטר.",
  solution:"app.post('/filter', async (req, res) => {\n  let filtered = [...games];\n  if (req.body.yearMin)\n    filtered = filtered.filter(g => g.year >= req.body.yearMin);\n  if (req.body.name)\n    filtered = filtered.filter(g =>\n      g.name.toLowerCase().includes(\n        req.body.name.toLowerCase()));\n  if (req.body.priceMax)\n    filtered = filtered.filter(g => g.price <= req.body.priceMax);\n  res.json(filtered);\n});",
  explain:"AND logic = שרשרת filter. כל filter מצמצם את filtered הקודם. אם פרמטר לא נשלח — מדלגים עליו."
},
{
  id:"react-useeffect",cat:"react",diff:"medium",title:"useEffect — localStorage sync",
  desc:'השלימו את הקוד כך ש-items ייטענו מ-localStorage בהתחלה, וישמרו אוטומטית בכל שינוי.',
  starter:"// השלימו את שני ה-useState וה-useEffect\n\nconst [items, setItems] = useState(\n  // מה שמים כאן?\n);\n\nuseEffect(() => {\n  // מה שמים כאן?\n}, [/* מה ה-dependency? */]);",

    {input:["__custom__"],expected:"__custom__",label:"useState initializes from localStorage"},
    {input:["__custom__"],expected:"__custom__",label:"uses JSON.parse for reading"},
    {input:["__custom__"],expected:"__custom__",label:"useEffect calls localStorage.setItem"},
    {input:["__custom__"],expected:"__custom__",label:"uses JSON.stringify for writing"},
    {input:["__custom__"],expected:"__custom__",label:"dependency array includes [items]"}
  ],
  customTest(code) {
    const results = [];
    // Test 1: useState initializes from localStorage
    const hasGetItem = /localStorage\.getItem/.test(code) && /useState\s*\(/.test(code);
    results.push({pass: hasGetItem, message: hasGetItem ? "useState initializes from localStorage" : "useState should be initialized with a value from localStorage.getItem(...)"});
    // Test 2: uses JSON.parse for reading
    const hasParse = /JSON\.parse\s*\(\s*localStorage\.getItem/.test(code);
    results.push({pass: hasParse, message: hasParse ? "uses JSON.parse for reading" : "should use _lsGet('items',null) to read stored data"});
    // Test 3: useEffect calls localStorage.setItem
    const hasSetItem = /useEffect\s*\(/.test(code) && /localStorage\.setItem/.test(code);
    results.push({pass: hasSetItem, message: hasSetItem ? "useEffect calls localStorage.setItem" : "useEffect should call localStorage.setItem to save items on change"});
    // Test 4: uses JSON.stringify for writing
    const hasStringify = /JSON\.stringify\s*\(\s*items\s*\)/.test(code);
    results.push({pass: hasStringify, message: hasStringify ? "uses JSON.stringify for writing" : "should use JSON.stringify(items) when saving to localStorage"});
    // Test 5: dependency array includes [items]
    const hasDep = /\}\s*,\s*\[\s*items\s*\]\s*\)/.test(code);
    results.push({pass: hasDep, message: hasDep ? "dependency array includes [items]" : "useEffect dependency array should be [items] so it runs on every change"});
    return results;
  },
  hint:"useState: _lsGet('items',null) || []. useEffect: localStorage.setItem('items', JSON.stringify(items)), dependency: [items].",
  solution:"const [items, setItems] = useState(\n  _lsGet('items',null) || []\n);\n\nuseEffect(() => {\n  localStorage.setItem('items', JSON.stringify(items));\n}, [items]);",
  explain:"useState מאותחל עם הערך מ-localStorage (|| [] כ-fallback). useEffect עם [items] שומר בכל שינוי."
},
{
  id:"bubble-sort",cat:"js",diff:"hard",title:"Bubble Sort ידני",
  desc:"כתבו פונקציה <code>bubbleSort(arr)</code> שממיינת מערך מספרים בסדר עולה.\nלא להשתמש ב-.sort()! השתמשו באלגוריתם Bubble Sort.",
  starter:"function bubbleSort(arr) {\n  // הקוד שלכם כאן\n  // אל תשתמשו ב-.sort()\n  \n}",
  tests:[
    {input:[[5,3,8,1,2]],expected:[1,2,3,5,8],label:"bubbleSort([5,3,8,1,2])"},
    {input:[[1,2,3]],expected:[1,2,3],label:"already sorted"},
    {input:[[3,2,1]],expected:[1,2,3],label:"reverse order"},
    {input:[[42]],expected:[42],label:"single element"},
    {input:[[]],expected:[],label:"empty array"}
  ],
  hint:"שתי לולאות מקוננות. אם arr[j] > arr[j+1] — החלפה: [arr[j], arr[j+1]] = [arr[j+1], arr[j]].",
  solution:"function bubbleSort(arr) {\n  const a = [...arr]; // don't mutate original\n  for (let i = 0; i < a.length; i++) {\n    for (let j = 0; j < a.length - 1 - i; j++) {\n      if (a[j] > a[j+1]) {\n        [a[j], a[j+1]] = [a[j+1], a[j]];\n      }\n    }\n  }\n  return a;\n}",
  explain:"לולאה חיצונית — מספר passes. פנימית — השוואת שכנים והחלפה. -1-i כי הסוף כבר ממוין."
},
{
  id:"is-subsequence",cat:"js",diff:"medium",title:"בדיקת תת-רצף",
  desc:"כתבו פונקציה <code>isSubsequence(arr, sub)</code> שבודקת האם <code>sub</code> מופיע כתת-רצף (לפי הסדר, לא רציף) בתוך <code>arr</code>.",
  starter:"function isSubsequence(arr, sub) {\n  // הקוד שלכם כאן\n  \n}",
  tests:[
    {input:[[1,2,3,4,5],[1,3,5]],expected:true,label:"isSubsequence([1,2,3,4,5],[1,3,5]) → true"},
    {input:[[1,2,3,4,5],[5,3,1]],expected:false,label:"isSubsequence([1,2,3,4,5],[5,3,1]) → false"},
    {input:[[1,2,3],[1,2,3]],expected:true,label:"equal arrays → true"},
    {input:[[1,2,3],[]],expected:true,label:"empty sub → true"},
    {input:[[],[1]],expected:false,label:"empty arr, non-empty sub → false"}
  ],
  hint:"שני מצביעים: i על arr, j על sub. אם arr[i]===sub[j] — קדמו את j. בסוף בדקו j===sub.length.",
  solution:"function isSubsequence(arr, sub) {\n  let j = 0;\n  for (let i = 0; i < arr.length && j < sub.length; i++) {\n    if (arr[i] === sub[j]) j++;\n  }\n  return j === sub.length;\n}",
  explain:"two pointers: i רץ על arr, j רץ על sub. כל התאמה מקדמת j. אם j הגיע לסוף — sub מוכל."
},

  starter:"function sumByDigitLength(arr) {\n  // הקוד שלכם כאן\n  \n}",
  tests:[

    {input:[[-12,34,5]],expected:{"2":22,"1":5},label:"negative numbers (Math.abs)"},
    {input:[[]],expected:{},label:"empty array → {}"},
    {input:[[0]],expected:{"1":0},label:"zero → length 1"}

  solution:"function sumByDigitLength(arr) {\n  const result = {};\n  for (const n of arr) {\n    const len = String(Math.abs(n)).length;\n    result[len] = (result[len] || 0) + n;\n  }\n  return result;\n}",

{
  id:"deep-equal",cat:"js",diff:"hard",title:"השוואה עמוקה",
  desc:"כתבו פונקציה <code>deepEqual(a, b)</code> שבודקת שוויון עמוק בין שני ערכים (primitives, arrays, objects).\nלא להשתמש ב-JSON.stringify!",
  starter:"function deepEqual(a, b) {\n  // הקוד שלכם כאן\n  \n}",
  tests:[
    {input:[{x:1,y:{z:2}},{x:1,y:{z:2}}],expected:true,label:"nested objects → true"},
    {input:[{x:1},{x:2}],expected:false,label:"different values → false"},
    {input:[[1,[2,3]],[1,[2,3]]],expected:true,label:"nested arrays → true"},
    {input:[1,1],expected:true,label:"primitives → true"},
    {input:[null,undefined],expected:false,label:"null !== undefined"}
  ],
  hint:"רקורסיה: אם שניהם primitives — ===. אם שניהם objects — בדקו אותם keys ואז deepEqual על כל ערך.",
  solution:"function deepEqual(a, b) {\n  if (a === b) return true;\n  if (a == null || b == null) return false;\n  if (typeof a !== 'object' || typeof b !== 'object') return false;\n  const keysA = Object.keys(a);\n  const keysB = Object.keys(b);\n  if (keysA.length !== keysB.length) return false;\n  return keysA.every(k => deepEqual(a[k], b[k]));\n}",
  explain:"בסיס: === לprimitive/null. רקורסיה: Object.keys + every כדי להשוות כל value בעומק."
},

{
  id:"mongoose-schema",cat:"express",diff:"medium",title:"Mongoose Schema + Model",
  desc:"השלימו את הגדרת ה-Schema כך שיכלול: name (חובה, מחרוזת), email (חובה, ייחודי), age (מספר, מינימום 0).",
  starter:"const mongoose = require('mongoose');\n\nconst userSchema = new mongoose.Schema({\n  // השלימו את השדות\n  \n});\n\nconst User = mongoose.model('User', userSchema);",
  tests:[
    {input:["__custom__"],expected:"__custom__",label:"defines name field with required"},
    {input:["__custom__"],expected:"__custom__",label:"defines email with unique: true"},
    {input:["__custom__"],expected:"__custom__",label:"defines age with min: 0"},
    {input:["__custom__"],expected:"__custom__",label:"creates model with mongoose.model"}

  customTest(code) {
    const results = [];
    const hasName = /name\s*:\s*\{[^}]*required\s*:\s*true/s.test(code) || /name\s*:\s*\{[^}]*type\s*:\s*String[^}]*required/s.test(code);
    results.push({pass:hasName, message: hasName?'defines name field with required':'name should be { type: String, required: true }'});

  solution:"import { useState, useEffect } from 'react';\n\nfunction ItemList() {\n  const [items, setItems] = useState(() => {\n    const saved = localStorage.getItem('items');\n    return saved ? JSON.parse(saved) : [];\n  });\n\n  useEffect(() => {\n    localStorage.setItem('items', JSON.stringify(items));\n  }, [items]);\n\n  function addItem(text) {\n    setItems([...items, { id: Date.now(), text }]);\n  }\n\n  return (\n    <div>\n      <button onClick={() => addItem('New Item')}>Add</button>\n      <ul>{items.map(i => <li key={i.id}>{i.text}</li>)}</ul>\n    </div>\n  );\n}",

    results.push({pass:updatesBody, message: updatesBody?'PUT updates fields from req.body':'update item fields from req.body (name, price)'});

  solution:"app.put('/items/:id', (req, res) => {\n  const item = items.find(i => i.id === Number(req.params.id));\n  if (!item) return res.status(404).json({ error: 'Not found' });\n  item.name = req.body.name || item.name;\n  item.price = req.body.price ?? item.price;\n  res.json(item);\n});\n\napp.delete('/items/:id', (req, res) => {\n  const index = items.findIndex(i => i.id === Number(req.params.id));\n  if (index === -1) return res.status(404).json({ error: 'Not found' });\n  items.splice(index, 1);\n  res.json({ message: 'Deleted' });\n});",

{

{
  id:"react-usefetch",cat:"react",diff:"hard",title:"Custom Hook — useFetch",
  desc:"בנו custom hook בשם <code>useFetch(url)</code> שמחזיר <code>{ data, loading, error }</code>.\nההוק צריך לבטל בקשה ישנה אם ה-URL משתנה (AbortController).",
  starter:"function useFetch(url) {\n  // 3 states: data, loading, error\n  // useEffect with fetch + AbortController\n  // return { data, loading, error }\n}",
  tests:[],
  customTest(code){
    const r=[];
    r.push({pass:/useState/.test(code),message:/useState/.test(code)?'uses useState':'must use useState for data/loading/error'});
    r.push({pass:/useEffect/.test(code),message:/useEffect/.test(code)?'uses useEffect':'must use useEffect for fetching'});
    r.push({pass:/AbortController/.test(code),message:/AbortController/.test(code)?'uses AbortController':'must use AbortController for cleanup'});
    r.push({pass:/signal/.test(code),message:/signal/.test(code)?'passes signal to fetch':'must pass controller.signal to fetch'});
    r.push({pass:/return.*\{/.test(code)&&/data/.test(code)&&/loading/.test(code),message:/data/.test(code)&&/loading/.test(code)?'returns {data, loading, error}':'must return object with data, loading, error'});
    r.push({pass:/\.abort\(\)/.test(code),message:/\.abort\(\)/.test(code)?'calls abort() in cleanup':'must call controller.abort() in useEffect cleanup'});
    return r;
  },
  hint:"const controller = new AbortController();\nfetch(url, {signal: controller.signal})\nreturn () => controller.abort(); // cleanup",
  solution:"function useFetch(url) {\n  const [data, setData] = useState(null);\n  const [loading, setLoading] = useState(true);\n  const [error, setError] = useState(null);\n\n  useEffect(() => {\n    const controller = new AbortController();\n    setLoading(true);\n    setError(null);\n\n    fetch(url, { signal: controller.signal })\n      .then(r => {\n        if (!r.ok) throw new Error('Failed');\n        return r.json();\n      })\n      .then(setData)\n      .catch(err => {\n        if (err.name !== 'AbortError') setError(err);\n      })\n      .finally(() => setLoading(false));\n\n    return () => controller.abort();\n  }, [url]);\n\n  return { data, loading, error };\n}",
  explain:"AbortController מבטל בקשות ישנות. cleanup function רצה לפני כל re-run ו-unmount. err.name !== 'AbortError' מבדיל בין ביטול לשגיאה אמיתית."
},

{

  starter:"function logger(req, res, next) {\n  // שמרו זמן התחלה\n  // האזינו ל-res.on('finish')\n  // הדפיסו method + URL + status + duration\n  // אל תשכחו next()!\n}",

{
  id:"express-rate-limit",cat:"express",diff:"hard",title:"Rate Limiter — 100 req/min",
  desc:"בנו middleware שמגביל כל IP ל-100 בקשות בדקה.\nאם עברו מגבלה — החזירו <code>429 Too Many Requests</code>.\nהשתמשו ב-Map פנימי.",
  starter:"const limits = new Map();\n\nfunction rateLimit(req, res, next) {\n  // בדקו req.ip\n  // אם עברו 100 בקשות בדקה → 429\n  // אחרת → next()\n}",
  tests:[],
  customTest(code){
    const r=[];
    r.push({pass:/new Map|Map\(\)/.test(code),message:/Map/.test(code)?'uses Map for storage':'must use Map to track requests per IP'});
    r.push({pass:/req\.ip/.test(code),message:/req\.ip/.test(code)?'uses req.ip':'must identify client by req.ip'});
    r.push({pass:/429/.test(code),message:/429/.test(code)?'returns 429 status':'must return 429 when limit exceeded'});
    r.push({pass:/next\s*\(/.test(code),message:/next\s*\(/.test(code)?'calls next()':'must call next() when under limit'});
    r.push({pass:/Date\.now|timestamp|resetAt/.test(code),message:/Date\.now|timestamp|reset/.test(code)?'tracks time window':'must track time window for rate limiting'});
    return r;
  },
  hint:"Map<ip, {count, resetAt}>.\nif (Date.now() > entry.resetAt) → reset.\nif (entry.count >= 100) → 429.\nelse → count++ + next()",
  solution:"const limits = new Map();\nconst WINDOW = 60 * 1000;\nconst MAX = 100;\n\nfunction rateLimit(req, res, next) {\n  const ip = req.ip;\n  const now = Date.now();\n  const entry = limits.get(ip);\n\n  if (!entry || now > entry.resetAt) {\n    limits.set(ip, { count: 1, resetAt: now + WINDOW });\n    return next();\n  }\n\n  if (entry.count >= MAX) {\n    return res.status(429).json({\n      error: 'Too many requests',\n      retryAfter: Math.ceil((entry.resetAt - now) / 1000)\n    });\n  }\n\n  entry.count++;\n  next();\n}",
  explain:"Map שומר count + resetAt לכל IP. אם הזמן עבר — reset. אם count >= 100 → 429. retryAfter מציין כמה לחכות."
},

  starter:"function fibPosition(n) {\n  // חשבו את מספרי פיבונאצ'י עד שמגיעים ל-n\n  // החזירו את המיקום (0-based)\n  // אם n לא בסדרה → -1\n}",
  tests:[

    {input:[1],expected:1,label:'fibPosition(1) → 1'},

    {input:[13],expected:7,label:'fibPosition(13) → 7'},
    {input:[4],expected:-1,label:'fibPosition(4) → -1 (not in series)'},

  ],

{
  id:"express-enum-validation",cat:"express",diff:"medium",title:"Express — Enum Validation + Route Order",
  desc:'השלימו שני routes:\n1. <code>GET /shipments/heavy?min=X</code> — מחזיר משלוחים עם weight >= min. <b>חייב לפני /:id!</b>\n2. <code>PUT /shipments/:id/status</code> — מעדכן status, אבל רק לערכים: <code>pending, shipped, delivered</code>.\n\n<b>באג נפוץ:</b> <code>req.query.min</code> הוא string — חובה <code>Number()</code>.',

{

  desc:'השלימו את ה-endpoint <code>GET /convert?from=X&to=Y&amount=Z</code> שממיר סכום בין מטבעות.\n\n<b>נוסחה:</b> result = (amount × fromRate.value) / toRate.value\n\n<b>שלושה חוקים חשובים:</b>\n<ol><li>כל query params הם strings — חובה <code>Number(amount)</code></li><li>בדקו שה-from ≠ to</li><li>בדקו חלוקה באפס (toRate.value === 0)</li></ol>',
  starter:"const rates = [\n  { type: 'USD', value: 3.7 },\n  { type: 'EUR', value: 4.0 },\n  { type: 'GBP', value: 4.7 }\n];\n\napp.get('/convert', (req, res) => {\n  const { from, to, amount } = req.query;\n  \n  // 1. מצאו fromRate ו-toRate\n  // 2. החזירו 404 אם אחד מהם לא קיים\n  // 3. בדקו from !== to (400 אם שווים)\n  // 4. בדקו toRate.value !== 0 (400 אם שווה לאפס)\n  // 5. חשבו: result = Number(amount) * fromRate.value / toRate.value\n  // 6. החזירו: { from, to, amount: Number(amount), result }\n  \n});",

    results.push({pass: hasNumber, message: hasNumber ? "uses Number(amount) to convert query string" : "req.query.amount is a string — use Number(amount) or parseFloat(amount) before arithmetic"});
    // Test 2: finds fromRate and toRate

    // Test 3: returns 404

    // Test 4: checks from !== to

    results.push({pass: hasSameCheck, message: hasSameCheck ? "checks from !== to (400 for same currency)" : "if (from === to) return res.status(400).json(...) — can't convert a currency to itself"});
    // Test 5: correct formula with division

  hint:"const fromRate = rates.find(r => r.type === from.toUpperCase());\nconst toRate = rates.find(r => r.type === to.toUpperCase());\nconst result = (Number(amount) * fromRate.value) / toRate.value;",

{

  prompt:`כתבו פונקציה <b>detectSeries(arr)</b> שמקבלת מערך מספרים ומחזירה:
<ul>
  <li><code>'arithmetic'</code> — אם ההפרש בין כל שני איברים עוקבים קבוע (סדרה חשבונית)</li>
  <li><code>'geometric'</code> — אם המנה בין כל שני איברים עוקבים קבועה (סדרה הנדסית)</li>

</ul>
<b>דוגמאות:</b>
<pre>[2, 5, 8, 11]   → 'arithmetic'  (הפרש=3)

[5]             → 'none'        (פחות מ-2 איברים)</pre>
⚠️ <b>מלכודת:</b> אם arr[0]===0 אי-אפשר לחלק — בדוק חשבונית <em>לפני</em> הנדסית.`,
  tests:[
    {label:"[2,5,8,11] → arithmetic", fn:c=>{try{const f=new Function('return ('+c+')');const fn=f();return fn([2,5,8,11])==='arithmetic'}catch(e){return false}}},
    {label:"[3,9,27,81] → geometric", fn:c=>{try{const f=new Function('return ('+c+')');const fn=f();return fn([3,9,27,81])==='geometric'}catch(e){return false}}},
    {label:"[1,2,4,9] → none",        fn:c=>{try{const f=new Function('return ('+c+')');const fn=f();return fn([1,2,4,9])==='none'}catch(e){return false}}},
    {label:"[0,0,0] → arithmetic",    fn:c=>{try{const f=new Function('return ('+c+')');const fn=f();return fn([0,0,0])==='arithmetic'}catch(e){return false}}},
    {label:"[5] → none",              fn:c=>{try{const f=new Function('return ('+c+')');const fn=f();return fn([5])==='none'}catch(e){return false}}}
  ],
  customTest:code=>{
    const hasArith=/arithmetic/.test(code);
    const hasGeo=/geometric/.test(code);
    const hasNone=/none/.test(code);
    const hasDiff=/\[\s*[ij]\s*\]\s*-\s*\w+\[\s*[ij]\s*-\s*1\s*\]|diff|difference/.test(code);
    const hasRatio=/ratio|\/\s*\w+\[\s*[ij]/.test(code);
    if(!hasArith)return{ok:false,msg:"חסרה החזרת 'arithmetic'"};
    if(!hasGeo)return{ok:false,msg:"חסרה החזרת 'geometric'"};
    if(!hasNone)return{ok:false,msg:"חסרה החזרת 'none'"};
    if(!hasDiff&&!hasRatio)return{ok:false,msg:"חסר חישוב הפרש או מנה"};
    return{ok:true,msg:"✅ מבנה תקין — כולל arithmetic + geometric + none"};
  },
  hint:"חשבונית: בדוק שכל arr[i]-arr[i-1] שווה לhפרש הראשון. הנדסית: בדוק שכל arr[i]/arr[i-1] שווה למנה הראשונה (רק אם arr[0]!==0).",
  solution:`function detectSeries(arr) {
  if (!Array.isArray(arr) || arr.length < 2) return 'none';

  // Check arithmetic: constant difference
  const diff = arr[1] - arr[0];
  const isArithmetic = arr.every((n, i) => i === 0 || n - arr[i - 1] === diff);
  if (isArithmetic) return 'arithmetic';

  // Check geometric: constant ratio (only if first element != 0)
  if (arr[0] === 0) return 'none';
  const ratio = arr[1] / arr[0];
  const isGeometric = arr.every((n, i) => i === 0 || n / arr[i - 1] === ratio);
  if (isGeometric) return 'geometric';

  return 'none';
}`,
  explain:"שתי הבדיקות רצות בנפרד. חשבונית: .every שבודק שהפרש קבוע. הנדסית: .every שבודק שמנה קבועה. חשוב לבדוק חשבונית <em>לפני</em> הנדסית ולדאוג שarr[0]!==0 לפני חלוקה."
},

    if(!hasLoop)return{ok:false,msg:"חסרה לולאה לאלגוריתם המיון"};

  hint:"השתמש ב-String(Math.abs(n)).split('').map(Number) לחילוץ הספרות, ממיין ב-Bubble Sort (שתי לולאות מקוננות), ואז join+Number.",
  solution:`function sortDigits(n) {
  const digits = String(Math.abs(n)).split('').map(Number);

  // Bubble sort (no .sort() allowed)
  for (let i = 0; i < digits.length; i++) {
    for (let j = 0; j < digits.length - i - 1; j++) {
      if (digits[j] > digits[j + 1]) {
        [digits[j], digits[j + 1]] = [digits[j + 1], digits[j]];
      }
    }
  }
  return Number(digits.join(''));
}`,

  solution:`function countInMatrix(matrix, numbers) {
  const result = {};

  numbers.forEach(n => result[n] = 0);

  // Traverse matrix

      if (result[cell] !== undefined) {
        result[cell]++;
      }
    });
  });
  return result;
}`,

  prompt:`כתבו קומפוננטת React <b>ParkingTimer</b> שמציגה:
<ul>
  <li>שעון עצר שסופר שניות מאז שהחנייה החלה</li>
  <li>כפתור Stop שעוצר את הטיימר</li>
  <li>כפתור Start שמפעיל טיימר חדש</li>
</ul>
<b>דרישות:</b>
<ul>
  <li>שימוש ב-<code>setInterval</code> בתוך useEffect</li>
  <li><strong>חובה:</strong> <code>return () => clearInterval(interval)</code> — cleanup!</li>
  <li>State: <code>seconds</code> (number), <code>running</code> (boolean)</li>
  <li>שימוש ב-<code>prev => prev + 1</code> בתוך setInterval (לא <code>seconds + 1</code>!)</li>
</ul>
⚠️ <b>מלכודת נפוצה:</b> שימוש ב-<code>seconds + 1</code> בתוך setInterval יגרום ל-stale closure — תמיד השתמש ב-<code>prev => prev + 1</code>.`,
  tests:[
    {label:"setInterval קיים",       fn:c=>/setInterval/.test(c)},
    {label:"clearInterval קיים",     fn:c=>/clearInterval/.test(c)},
    {label:"useEffect קיים",         fn:c=>/useEffect/.test(c)},
    {label:"return cleanup קיים",    fn:c=>/return\s*\(\s*\)\s*=>.*clearInterval/.test(c)},
    {label:"prev => prev + 1",       fn:c=>/prev\s*=>\s*prev\s*\+\s*1/.test(c)}
  ],
  customTest:code=>{
    if(!/setInterval/.test(code))return{ok:false,msg:"חסר setInterval"};
    if(!/clearInterval/.test(code))return{ok:false,msg:"⛔ חסר clearInterval — memory leak!"};
    if(!/return\s*\(\s*\)\s*=>\s*clearInterval/.test(code))return{ok:false,msg:"חסרה פונקציית cleanup ב-return של useEffect"};
    if(!/prev\s*=>\s*prev\s*\+\s*1/.test(code))return{ok:false,msg:"⚠️ השתמש ב-prev => prev + 1 במקום seconds + 1 (stale closure!)"};
    return{ok:true,msg:"✅ setInterval + clearInterval cleanup + prev => prev+1"};
  },
  hint:"useEffect עם [running] כ-dependency. אם running===true: const id = setInterval(() => setSeconds(prev=>prev+1), 1000). תמיד: return () => clearInterval(id).",
  solution:`function ParkingTimer() {
  const [seconds, setSeconds] = useState(0);
  const [running, setRunning] = useState(false);

  useEffect(() => {
    if (!running) return; // do nothing if stopped

    const interval = setInterval(() => {
      setSeconds(prev => prev + 1); // ✅ prev form — no stale closure
    }, 1000);

    return () => clearInterval(interval); // ✅ cleanup on unmount or re-run
  }, [running]);

  const stop  = () => setRunning(false);
  const start = () => { setSeconds(0); setRunning(true); };

  return (
    <div>
      <h2>⏱ {seconds} שניות</h2>
      <button onClick={start}>Start</button>
      <button onClick={stop}>Stop</button>
    </div>
  );
}`,
  explain:"שלושה כללים לטיימר ב-React: (1) setInterval בתוך useEffect עם [running]. (2) תמיד return () => clearInterval() — בלי זה יש memory leak ו-multiple timers. (3) setSeconds(prev => prev + 1) ולא setSeconds(seconds + 1) — stale closure גורם לספירה תקועה."
},

  title:"ספירת תת-רצפים עוקבים עם סכום מטרה",
  prompt:`כתבו פונקציה <b>countSubsequences(arr, target)</b> שמחזירה כמה תת-רצפים <strong>עוקבים</strong> (contiguous) של arr מסתכמים ל-target.
<pre>countSubsequences([1,2,3,2,1], 3) → 3
// [1,2], [3], [2,1]
countSubsequences([1,1,1],    2) → 2
// [1,1] (מיקום 0-1) + [1,1] (מיקום 1-2)
countSubsequences([5],        5) → 1</pre>
⚠️ <b>מלכודת:</b> תת-רצף חייב להיות <em>עוקב</em> במערך — לא ניתן לדלג על איברים. גישה נאיבית (O(n²)) מקובלת.`,
  tests:[
    {label:"[1,2,3,2,1] target=3 → 3", fn:c=>{try{const f=new Function('return ('+c+')');const fn=f();return fn([1,2,3,2,1],3)===3}catch(e){return false}}},
    {label:"[1,1,1] target=2 → 2",     fn:c=>{try{const f=new Function('return ('+c+')');const fn=f();return fn([1,1,1],2)===2}catch(e){return false}}},
    {label:"[5] target=5 → 1",          fn:c=>{try{const f=new Function('return ('+c+')');const fn=f();return fn([5],5)===1}catch(e){return false}}},
    {label:"[1,2] target=10 → 0",       fn:c=>{try{const f=new Function('return ('+c+')');const fn=f();return fn([1,2],10)===0}catch(e){return false}}}
  ],
  customTest:code=>{
    const hasNestedLoop=/for[\s\S]{1,300}for/.test(code);
    const hasSum=/sum|acc|total/.test(code);
    const hasCount=/count|result/.test(code);
    if(!hasNestedLoop)return{ok:false,msg:"חסרות לולאות מקוננות — לכל התחלה (i) עובר על כל סיום (j)"};
    if(!hasSum)return{ok:false,msg:"חסרה משתנה סכום מצטבר (sum/acc/total)"};
    if(!hasCount)return{ok:false,msg:"חסרה ספירת תת-רצפים תקינים"};
    return{ok:true,msg:"✅ לולאות מקוננות + סכום + ספירה"};
  },
  hint:"לולאה חיצונית i (נקודת התחלה). לולאה פנימית j מ-i, צובר sum. אם sum===target → count++. אם sum>target → break (אופטימיזציה).",
  solution:`function countSubsequences(arr, target) {
  let count = 0;
  for (let i = 0; i < arr.length; i++) {
    let sum = 0;
    for (let j = i; j < arr.length; j++) {
      sum += arr[j];
      if (sum === target) count++;
      if (sum > target && arr.every(n => n >= 0)) break; // optimization for positive arrays
    }
  }
  return count;
}`,
  explain:"O(n²): לכל נקודת התחלה i, מצבר סכום וסופר כמה פעמים הגענו ל-target. break כשעוברים את ה-target (רק אם כל המספרים חיוביים). זה בדיוק ה-pattern של parking-q2 במבחן."
},

  tests:[
    {label:"'1010' → {decimal:10, isPalindrome:false}", fn:c=>{try{const f=new Function('return ('+c+')');const fn=f();const r=fn('1010');return r.decimal===10&&r.isPalindrome===false}catch(e){return false}}},
    {label:"'1001' → {decimal:9, isPalindrome:true}",  fn:c=>{try{const f=new Function('return ('+c+')');const fn=f();const r=fn('1001');return r.decimal===9&&r.isPalindrome===true}catch(e){return false}}},

    {label:"'11' → {decimal:3, isPalindrome:true}",    fn:c=>{try{const f=new Function('return ('+c+')');const fn=f();const r=fn('11');return r.decimal===3&&r.isPalindrome===true}catch(e){return false}}}

    if(/parseInt\s*\(/.test(code))return{ok:false,msg:"⛔ parseInt אסור — המרה ידנית בלבד"};
    const hasDecimal=/decimal/.test(code);
    const hasPalin=/isPalindrome|palindrome/.test(code);
    const hasPow=/\*\*\s*|Math\.pow|<<|pow/.test(code)||/\*\s*2|\+\s*parseInt/.test(code)||/reduce|forEach|for/.test(code);
    if(!hasDecimal)return{ok:false,msg:"חסר שדה decimal באובייקט המוחזר"};
    if(!hasPalin)return{ok:false,msg:"חסר שדה isPalindrome באובייקט המוחזר"};
    if(!hasPow)return{ok:false,msg:"חסרת חישוב הבינארי ידנית (לולאה + כפל ב-2 / חזקות)"};
    return{ok:true,msg:"✅ המרה ידנית + isPalindrome + מבנה נכון"};

  solution:`function binaryAnalysis(binaryStr) {
  // Manual binary → decimal conversion
  let decimal = 0;
  for (let i = 0; i < binaryStr.length; i++) {
    decimal = decimal * 2 + Number(binaryStr[i]);
  }

  // Palindrome check on the original string
  const isPalindrome = binaryStr === binaryStr.split('').reverse().join('');

  return { decimal, isPalindrome };
}`,

{

  title:"סכום לפי מספר ספרות — Football Q2",
  prompt:`כתבו פונקציה <b>sumByDigitCount(arr)</b> שמקבלת מערך מספרים ומחזירה אובייקט:
<ul>
  <li>המפתח = מספר הספרות (כמה ספרות במספר)</li>
  <li>הערך = סכום כל המספרים עם אותו מספר ספרות</li>
  <li>מספרים שליליים: השתמשו ב-<code>Math.abs()</code> לחישוב האורך, אבל הוסיפו את המספר כמות שהוא לסכום</li>
</ul>
<b>דוגמה:</b><br>
<code>sumByDigitCount([12, -5, 100, 7, 23, -45]) // {2:12+(-5)+23+(-45)=-15, 3:100, 1:7}</code>`,
  tests:[
    {label:"מספרים בני 1 ספרה נסכמים ביחד", fn:c=>/Math\.abs/.test(c)},
    {label:"שימוש ב-Math.abs לחישוב אורך",   fn:c=>/Math\.abs/.test(c)},
    {label:"חישוב אורך כ-String",            fn:c=>/String\(|\.toString\(/.test(c)},
    {label:"צבירה עם || 0",                  fn:c=>/\|\|\s*0/.test(c)}
  ],
  customTest:code=>{
    const hasAbs=/Math\.abs/.test(code);
    const hasLen=/String\s*\([\s\S]{1,30}\.length|\.toString\s*\(\)\.length/.test(code);
    const hasAccum=/\[\s*len\s*\]|\[key\]|\[digits\]|\[count\]|\[k\]/i.test(code)&&/\|\|\s*0/.test(code);
    if(!hasAbs)return{ok:false,msg:"חסר Math.abs() — מספרים שליליים יפגעו בחישוב האורך"};
    if(!hasLen)return{ok:false,msg:"חסר String(Math.abs(n)).length — כך מחשבים מספר ספרות"};
    if(!hasAccum)return{ok:false,msg:"חסר pattern של result[len]=(result[len]||0)+n"};
    return{ok:true,msg:"✅ Math.abs + String length + צבירה עם ||0"};
  },
  hint:"const len=String(Math.abs(n)).length; result[len]=(result[len]||0)+n;",
  solution:`function sumByDigitCount(arr) {
  if (!Array.isArray(arr)) throw new Error('Input must be an array');
  const result = {};
  for (const n of arr) {
    if (typeof n !== 'number') continue;
    const len = String(Math.abs(n)).length;  // ← Math.abs לשליליים!
    result[len] = (result[len] || 0) + n;     // ← צבירה עם ||0
  }
  return result;
}
// [12, -5, 100, 7, 23, -45]
// n=12 → len=2, n=-5 → Math.abs(-5)=5 → len=1
// n=100 → len=3, n=7 → len=1, n=23 → len=2, n=-45 → len=2`,

},

<pre>isSubArrayInOrder([1,5,3,8,2], [5,8])   // true  (5 מופיע לפני 8)
isSubArrayInOrder([1,5,3,8,2], [8,5])   // false (8 מופיע אחרי 5, לא לפניו)

isSubArrayInOrder([1,2,3], [4])         // false</pre>`,
  tests:[
    {label:"[5,8] בתוך [1,5,3,8,2] → true",  fn:c=>/indexOf|findIndex|pointer|idx/.test(c)},
    {label:"[8,5] בתוך [1,5,3,8,2] → false", fn:c=>/false/.test(c)},
    {label:"מנגנון pointer/index מתקדם",      fn:c=>/pointer|idx\s*\+\+|i\+\+|j\+\+/.test(c)},
    {label:"קלט ריק מטופל",                   fn:c=>/length\s*===?\s*0|!arr|!subArr/.test(c)}
  ],
  customTest:code=>{
    const hasPointer=/\bpointer\b|\bidx\b|\bi\b.*\+\+|\bj\b.*\+\+/.test(code);
    const hasFalse=/return\s+false/.test(code);
    const hasTrue=/return\s+pointer|return\s+true|===\s+subArr\.length/.test(code);
    if(!hasPointer&&!/indexOf/.test(code)&&!/findIndex/.test(code))
      return{ok:false,msg:"השתמשו ב-pointer/index שמתקדם ב-arr בזמן שמחפשים כל איבר של subArr"};
    if(!hasFalse)return{ok:false,msg:"חסרה החזרת false כשאיבר לא נמצא"};
    if(!hasTrue)return{ok:false,msg:"חסרה החזרת true בסוף (כאשר כל האיברים נמצאו)"};
    return{ok:true,msg:"✅ pointer pattern + true/false החזרה"};
  },
  hint:`function isSubArrayInOrder(arr, subArr) {
  let pointer = 0;
  for (const item of arr) {
    if (item === subArr[pointer]) pointer++;
    if (pointer === subArr.length) return true;
  }
  return false;
}`,
  solution:`function isSubArrayInOrder(arr, subArr) {
  if (!Array.isArray(arr) || !Array.isArray(subArr)) return false;
  if (subArr.length === 0) return true;
  let pointer = 0;  // מצביע על האיבר הנוכחי שאנחנו מחפשים ב-subArr
  for (const item of arr) {
    if (item === subArr[pointer]) {
      pointer++;              // נמצא! נתקדם ל-subArr הבא
    }
    if (pointer === subArr.length) return true; // כולם נמצאו!
  }
  return false; // לא מצאנו את כולם
}`,
  explain:"זה travel-q2. הtrick: pointer שמצביע על האיבר הנוכחי ב-subArr. עוברים על arr — כל פעם שהאיבר הנוכחי ב-arr שווה ל-subArr[pointer], מתקדמים את pointer. אם pointer הגיע לאורך subArr — הצלחנו."
},

{
  id:"react-clear-errors-onchange",cat:"react",diff:"medium",
  title:"ולידציה: ניקוי שגיאות onChange — פריט קריטי",
  prompt:`<b>באג נפוץ:</b> שגיאות ולידציה נשארות על המסך גם אחרי שהמשתמש מתחיל לתקן. כתבו component <b>SmartForm</b> עם:
<ul>
  <li>שדות: <code>username</code> (3+ תווים), <code>password</code> (6+ תווים)</li>
  <li>state: <code>errors</code> כאובייקט <code>{username:'', password:''}</code></li>
  <li>onChange לכל שדה: מנקה את השגיאה של <b>אותו שדה בלבד</b> מיד עם ההקלדה</li>
  <li>onSubmit: מאמת, ואם יש שגיאות — מציג אותן; אחרת — מוציא alert הצלחה</li>
</ul>
<b>המפתח:</b> onChange → <code>setErrors(prev => ({...prev, [field]: ''}))</code>`,
  tests:[
    {label:"errors state כאובייקט",          fn:c=>/useState\s*\(\s*\{/.test(c)},
    {label:"ניקוי שגיאה ב-onChange",        fn:c=>/setErrors\s*\(|errors.*''|errors.*\"\"|prev.*spread/i.test(c)},
    {label:"spread + computed key [field]",  fn:c=>/\.\.\.prev|\.\.\.\s*errors|\[.*\]\s*:/.test(c)},
    {label:"ולידציה ב-onSubmit",            fn:c=>/onSubmit|handleSubmit/.test(c)&&/length/.test(c)}
  ],
  customTest:code=>{
    const hasErrState=/useState\s*\(\s*\{/.test(code)||/errors.*\{/.test(code);
    const hasSpread=/\.\.\.\s*prev|\.\.\.\s*errors/.test(code);
    const hasComputedKey=/\[.*field.*\]|\[.*name.*\]|\[.*key.*\]/.test(code)||(hasSpread&&/:\s*''|:\s*""/.test(code));
    const hasClearOnChange=/onChange[\s\S]{1,80}setErrors|setErrors[\s\S]{1,80}onChange/.test(code);
    if(!hasErrState)return{ok:false,msg:"errors צריך להיות אובייקט ({username:'', password:''}), לא מחרוזת"};
    if(!hasSpread)return{ok:false,msg:"חסר spread operator: setErrors(prev=>({...prev, [field]:''}))"};
    if(!hasComputedKey)return{ok:false,msg:"חסר computed property key [fieldName]:'' לניקוי שגיאה ספציפית"};
    if(!hasClearOnChange)return{ok:false,msg:"ניקוי השגיאה חייב להיות ב-onChange, לא רק ב-submit"};
    return{ok:true,msg:"✅ errors אובייקט + spread + computed key + ניקוי ב-onChange"};
  },
  hint:"onChange={(e)=>{ setField(e.target.value); setErrors(prev=>({...prev, username:''})); }}  — או יותר כללי עם [name] computed key",
  solution:`function SmartForm() {
  const [username, setUsername] = useState('');
  const [password, setPassword] = useState('');
  const [errors, setErrors] = useState({ username: '', password: '' });

  // ניקוי שגיאה מיד עם הקלדה — critical!
  function handleChange(field, value) {
    if (field === 'username') setUsername(value);
    if (field === 'password') setPassword(value);
    setErrors(prev => ({ ...prev, [field]: '' }));  // ← spread + computed key
  }

  function handleSubmit(e) {
    e.preventDefault();
    const newErrors = { username: '', password: '' };
    if (username.length < 3) newErrors.username = 'שם משתמש: מינימום 3 תווים';
    if (password.length < 6) newErrors.password = 'סיסמה: מינימום 6 תווים';
    if (newErrors.username || newErrors.password) {
      setErrors(newErrors);
      return;
    }
    alert('✅ הצלחה!');
  }

  return (
    <form onSubmit={handleSubmit}>
      <input value={username} onChange={e=>handleChange('username',e.target.value)}/>
      {errors.username && <p style={{color:'red'}}>{errors.username}</p>}
      <input type="password" value={password} onChange={e=>handleChange('password',e.target.value)}/>
      {errors.password && <p style={{color:'red'}}>{errors.password}</p>}
      <button>שלח</button>
    </form>
  );
}`,
  explain:"פריט קריטי שנמצא כבאג בכמה מבחנות: שגיאות שלא נמחקות בזמן הקלדה. הפתרון: setErrors(prev=>({...prev,[field]:''})) ב-onChange. ה-spread ...prev שומר שגיאות של שדות אחרים, ו-[field] (computed key) מנקה רק את השדה שהשתנה."
},

  solution:`const express = require('express');
const mongoose = require('mongoose');
const app = express();
app.use(express.json());  // ← חובה!

mongoose.connect('mongodb://localhost/studentsDB');

const studentSchema = new mongoose.Schema({
  name:  { type: String, required: true },
  grade: { type: Number, required: true },
  city:  String
});
const Student = mongoose.model('Student', studentSchema);

// GET all
app.get('/students', async (req, res) => {
  try {
    const students = await Student.find();
    res.json(students);
  } catch(err) { res.status(500).json({error: err.message}); }
});

// POST create → 201!
app.post('/students', async (req, res) => {
  try {
    const student = await Student.create(req.body);
    res.status(201).json(student);  // ← 201 ולא 200!
  } catch(err) { res.status(400).json({error: err.message}); }
});

// PUT update
app.put('/students/:id', async (req, res) => {
  try {
    const student = await Student.findByIdAndUpdate(
      req.params.id, req.body,
      { new: true, runValidators: true }  // ← new:true חשוב!
    );
    if(!student) return res.status(404).json({error: 'Not found'});
    res.json(student);
  } catch(err) { res.status(400).json({error: err.message}); }
});

// DELETE
app.delete('/students/:id', async (req, res) => {
  try {
    const student = await Student.findByIdAndDelete(req.params.id);
    if(!student) return res.status(404).json({error: 'Not found'});
    res.json({message: 'Deleted'});
  } catch(err) { res.status(500).json({error: err.message}); }
});

app.listen(3000);`,

},

    html += `<div class="output-wrap">
      <div class="output-head neutral">📋 תרגיל עיוני</div>
      <div class="output-body" style="padding:14px;font-size:13px;font-weight:600">תרגיל זה הוא עיוני — כתבו את הקוד ובדקו אותו מול הפתרון. לחצו על "👁 פתרון" לבדיקה עצמית.</div>
    </div>`;
  }

  html += `<div class="solution-box" id="solution-box">
    <div class="solution-head">✅ פתרון</div>
    <pre class="solution-code">${escHtml(ex.solution)}</pre>
    <div class="solution-explain">${ex.explain}</div>
  </div>`;

  main.innerHTML = html;
}

function getEditorCode() {
  return document.getElementById('editor').innerText;
}

function runTests() {
  if (!_activeEx || _activeEx.manualTest) return;
  const code = getEditorCode();
  const wrap = document.getElementById('output-wrap');
  const head = document.getElementById('output-head');
  const body = document.getElementById('output-body');
  wrap.style.display = 'block';

  let allPass = true;
  let html = '';

  if (_activeEx.customTest) {
    // Custom test path for exercises that need pattern matching / special logic
    try {
      const results = _activeEx.customTest(code);
      for (let i = 0; i < results.length; i++) {
        const r = results[i];
        if (!r.pass) allPass = false;
        html += `<div class="test-row">
          <span class="${r.pass ? 'test-pass' : 'test-fail'}">${r.pass ? '✅' : '❌'}</span>
          <span>${r.message}</span>
        </div>`;
      }
    } catch (e) {
      allPass = false;
      html += `<div class="test-row"><span class="test-fail">💥</span><span>Test error</span><span style="color:var(--red);margin-right:auto">${e.message}</span></div>`;
    }
  } else {
    // Standard test path: invoke function by name with test inputs
    for (const test of _activeEx.tests) {
      try {
        const fn = new Function(code + `\nreturn ${_activeEx.id.replace(/-([a-z])/g, (_, c) => c.toUpperCase())}(...arguments);`);
        const result = fn(...test.input);
        const expected = test.expected;
        const pass = JSON.stringify(result) === JSON.stringify(expected);
        if (!pass) allPass = false;
        html += `<div class="test-row">
          <span class="${pass ? 'test-pass' : 'test-fail'}">${pass ? '✅' : '❌'}</span>
          <span>${test.label}</span>
          ${!pass ? `<span style="color:var(--red);margin-right:auto">got: ${JSON.stringify(result)}</span>` : ''}
        </div>`;
      } catch (e) {
        allPass = false;
        html += `<div class="test-row"><span class="test-fail">💥</span><span>${test.label}</span><span style="color:var(--red);margin-right:auto">${e.message}</span></div>`;
      }
    }
  }

  head.className = 'output-head ' + (allPass ? 'pass' : 'fail');
  head.textContent = allPass ? '🎉 כל הבדיקות עברו!' : '❌ יש בדיקות שנכשלו';
  body.innerHTML = html;

  if (allPass && !solved[_activeEx.id]) {
    solved[_activeEx.id] = true;
    streak++;
    localStorage.setItem('pb-solved', JSON.stringify(solved));
    updateStats();
    document.querySelectorAll('.sb-btn').forEach(b => {
      if (b.dataset.eid === _activeEx.id) b.querySelector('.check').textContent = '✅';
    });
  } else if (!allPass) {
    streak = 0;
    updateStats();
  }
}

function showHint() {
  document.getElementById('hint-box').classList.toggle('visible');
}

function showSolution() {
  document.getElementById('solution-box').classList.toggle('visible');
}

function resetEditor() {
  if (!_activeEx) return;
  document.getElementById('editor').innerText = _activeEx.starter;
  const wrap = document.getElementById('output-wrap');
  if (wrap) wrap.style.display = 'none';
  document.getElementById('hint-box').classList.remove('visible');
  document.getElementById('solution-box').classList.remove('visible');
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

updateStats();

// Keyboard shortcuts
document.addEventListener('keydown', function(e){
  const tag = document.activeElement.tagName.toLowerCase();
  if(tag==='input'||tag==='textarea'||document.activeElement.isContentEditable) return;

  // Arrow keys: prev/next exercise
  if(e.key==='ArrowLeft'||e.key==='ArrowRight'){
    if(!EXERCISES.length) return;
    const idx = _activeEx ? EXERCISES.findIndex(ex=>ex.id===_activeEx.id) : -1;
    let next;
    if(e.key==='ArrowRight') next = idx < EXERCISES.length-1 ? idx+1 : 0;
    else next = idx > 0 ? idx-1 : EXERCISES.length-1;
    selectExercise(EXERCISES[next].id);
    e.preventDefault();
    return;
  }

  // ESC: close hint and solution panels
  if(e.key==='Escape'){
    const hint = document.getElementById('hint-box');
    const sol = document.getElementById('solution-box');
    let closed = false;
    if(hint && hint.classList.contains('visible')){hint.classList.remove('visible');closed=true;}
    if(sol && sol.classList.contains('visible')){sol.classList.remove('visible');closed=true;}
    if(closed) e.preventDefault();
    return;
  }
});
</script>
