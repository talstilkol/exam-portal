<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="description" content="📚 מרכז ידע למבחן — פורטל הכנה למבחן Fullstack">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>📚 מרכז ידע למבחן</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;700;800;900&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   CSS VARIABLES
   ========================================================================== */
:root {
  --bg: #f4f7fb;
  --bg-alt: #eef2f7;
  --ink: #0f172a;
  --ink-muted: #64748b;
  --ink-light: #94a3b8;
  --card: #fff;
  --card-hover: #fafbfc;
  --border: #0f172a;
  --border-light: #e2e8f0;
  --border-muted: #cbd5e1;

  --brand: #7c3aed;
  --brand-dark: #5b21b6;
  --brand-light: #ede9fe;
  --brand-lighter: #f5f3ff;

  --green: #16a34a;
  --green-dark: #166534;
  --green-light: #dcfce7;
  --green-lighter: #f0fdf4;
  --green-border: #166534;

  --red: #dc2626;
  --red-dark: #991b1b;
  --red-light: #fef2f2;
  --red-lighter: #fff5f5;
  --red-border: #991b1b;

  --blue: #2563eb;
  --blue-dark: #1e40af;
  --blue-light: #dbeafe;
  --blue-lighter: #eff6ff;
  --blue-border: #1e40af;

  --orange: #f97316;
  --orange-light: #fff7ed;
  --gold: #facc15;
  --gold-light: #fefce8;

  --purple: #7c3aed;
  --purple-light: #f5f3ff;
  --purple-border: #5b21b6;

  --shadow: 4px 4px 0 #000;
  --shadow-sm: 2px 2px 0 #000;
  --shadow-lg: 6px 6px 0 #000;
  --shadow-hover: 5px 5px 0 #000;

  --radius: 16px;
  --radius-sm: 12px;
  --radius-xs: 8px;
  --radius-round: 50px;

  --sidebar-width: 280px;
  --transition: all 0.2s ease;
  --transition-fast: all 0.15s ease;
}

/* ==========================================================================
   RESET & BASE
   ========================================================================== */
*,
*::before,
*::after {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

html {
  scroll-behavior: smooth;
  -webkit-text-size-adjust: 100%;
}

body {
  font-family: 'Heebo', Arial, sans-serif;
  background: var(--bg);
  color: var(--ink);
  line-height: 1.7;
  min-height: 100vh;
  overflow-x: hidden;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

/* Selection */
::selection {
  background: var(--brand-light);
  color: var(--brand-dark);
}

/* Focus visible */
:focus-visible {
  outline: 3px solid var(--brand);
  outline-offset: 2px;
  border-radius: 4px;
}

/* Scrollbar */
::-webkit-scrollbar {
  width: 8px;
  height: 8px;
}

::-webkit-scrollbar-track {
  background: transparent;
}

::-webkit-scrollbar-thumb {
  background: var(--border-muted);
  border-radius: 4px;
}

::-webkit-scrollbar-thumb:hover {
  background: var(--ink-muted);
}

/* ==========================================================================
   HERO SECTION
   ========================================================================== */
.hero {
  background: linear-gradient(135deg, #020617 0%, #1e1b4b 35%, #7c3aed 70%, #a855f7 100%);
  color: #fff;
  padding: 48px 30px 44px;
  border-bottom: 3px solid #000;
  text-align: center;
  position: relative;
  overflow: hidden;
}

.hero::before {
  content: '';
  position: absolute;
  top: -60%;
  right: -15%;
  width: 500px;
  height: 500px;
  background: radial-gradient(circle, rgba(167, 139, 250, 0.25) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}

.hero::after {
  content: '';
  position: absolute;
  bottom: -40%;
  left: -10%;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(99, 102, 241, 0.2) 0%, transparent 70%);
  border-radius: 50%;
  pointer-events: none;
}

.hero-content {
  position: relative;
  z-index: 1;
  max-width: 700px;
  margin: 0 auto;
}

.hero h1 {
  font-size: clamp(28px, 5vw, 44px);
  font-weight: 900;
  margin-bottom: 10px;
  text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
  letter-spacing: -0.5px;
}

.hero p {
  font-size: clamp(14px, 2.5vw, 18px);
  color: #c4b5fd;
  font-weight: 400;
  margin-bottom: 20px;
}

.hero-stats {
  display: flex;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
  margin-top: 16px;
}

.hero-stat {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  background: rgba(255,255,255,0.08);
  border: 2px solid rgba(255,255,255,0.15);
  border-radius: var(--radius-round);
  padding: 8px 18px;
  font-size: 13px;
  font-weight: 700;
  backdrop-filter: blur(4px);
}

.hero-stat .stat-icon {
  font-size: 16px;
}

.progress-track {
  width: 100px;
  height: 8px;
  background: rgba(255,255,255,0.15);
  border-radius: 4px;
  overflow: hidden;
  margin-right: 8px;
}

.progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--gold), #fbbf24);
  border-radius: 4px;
  transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
}

/* Search in Hero */
.hero-search {
  margin-top: 20px;
  position: relative;
  max-width: 400px;
  margin-left: auto;
  margin-right: auto;
}

.hero-search input {
  width: 100%;
  padding: 12px 20px;
  padding-right: 44px;
  border: 2px solid rgba(255,255,255,0.2);
  border-radius: var(--radius-round);
  background: rgba(255,255,255,0.1);
  color: #fff;
  font-family: inherit;
  font-size: 14px;
  font-weight: 500;
  backdrop-filter: blur(8px);
  outline: none;
  transition: var(--transition);
}

.hero-search input::placeholder {
  color: rgba(255,255,255,0.5);
}

.hero-search input:focus {
  border-color: rgba(255,255,255,0.5);
  background: rgba(255,255,255,0.15);
  box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.3);
}

.hero-search .search-icon {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 18px;
  opacity: 0.6;
  pointer-events: none;
}

/* Search results dropdown */
.search-results {
  position: absolute;
  top: calc(100% + 8px);
  left: 0;
  right: 0;
  background: var(--card);
  border: 3px solid #000;
  border-radius: var(--radius-sm);
  box-shadow: var(--shadow);
  max-height: 250px;
  overflow-y: auto;
  z-index: 100;
  display: none;
}

.search-results.visible {
  display: block;
  animation: slideDown 0.2s ease;
}

.search-result-item {
  padding: 10px 16px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 10px;
  border-bottom: 1px solid var(--border-light);
  transition: var(--transition-fast);
}

.search-result-item:last-child {
  border-bottom: none;
}

.search-result-item:hover {
  background: var(--brand-light);
  color: var(--brand);
}

.search-result-item .result-cat {
  font-size: 11px;
  color: var(--ink-muted);
  font-weight: 500;
  margin-right: auto;
}

/* ==========================================================================
   LAYOUT
   ========================================================================== */
.app-layout {
  display: flex;
  min-height: calc(100vh - 250px);
}

/* ==========================================================================
   SIDEBAR
   ========================================================================== */
.sidebar {
  width: var(--sidebar-width);
  background: var(--card);
  border-left: 3px solid #000;
  padding: 20px 0;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  flex-shrink: 0;
  z-index: 10;
}

.sidebar-header {
  padding: 0 20px 16px;
  border-bottom: 2px solid var(--border-light);
  margin-bottom: 16px;
}

.sidebar-header h3 {
  font-size: 14px;
  font-weight: 800;
  color: var(--ink);
  display: flex;
  align-items: center;
  gap: 6px;
}

.sidebar-header .total-badge {
  background: var(--brand-light);
  color: var(--brand);
  font-size: 11px;
  padding: 2px 8px;
  border-radius: var(--radius-round);
  font-weight: 800;
}

.sidebar-group {
  margin-bottom: 20px;
}

.sidebar-group-title {
  font-size: 11px;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 1.2px;
  color: var(--ink-muted);
  padding: 0 20px;
  margin-bottom: 6px;
  display: flex;
  align-items: center;
  gap: 6px;
}

.sidebar-group-title::after {
  content: '';
  flex: 1;
  height: 1px;
  background: var(--border-light);
}

.sidebar-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 20px;
  cursor: pointer;
  font-weight: 600;
  font-size: 14px;
  transition: var(--transition-fast);
  border-right: 4px solid transparent;
  position: relative;
  user-select: none;
}

.sidebar-item:hover {
  background: var(--brand-lighter);
  color: var(--brand);
}

.sidebar-item.active {
  background: var(--brand-light);
  border-right-color: var(--brand);
  color: var(--brand);
  font-weight: 800;
}

.sidebar-item .icon {
  font-size: 20px;
  width: 28px;
  text-align: center;
  flex-shrink: 0;
}

.sidebar-item .name {
  flex: 1;
}

.sidebar-item .viewed-badge {
  width: 8px;
  height: 8px;
  background: var(--green);
  border-radius: 50%;
  border: 2px solid var(--card);
  box-shadow: 0 0 0 1px var(--green);
  flex-shrink: 0;
}

.sidebar-item .count-badge {
  font-size: 10px;
  font-weight: 800;
  color: var(--ink-muted);
  background: var(--bg);
  padding: 1px 6px;
  border-radius: var(--radius-round);
  border: 1.5px solid var(--border-light);
}

/* ==========================================================================
   MAIN CONTENT AREA
   ========================================================================== */
.main-content {
  flex: 1;
  padding: 32px;
  max-width: 920px;
  min-width: 0;
}

/* Topic Header */
.topic-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 32px;
  padding-bottom: 20px;
  border-bottom: 2px solid var(--border-light);
}

.topic-header .topic-icon {
  font-size: 44px;
  width: 72px;
  height: 72px;
  display: flex;
  align-items: center;
  justify-content: center;
  background: var(--card);
  border: 3px solid #000;
  border-radius: var(--radius);
  box-shadow: var(--shadow-sm);
  flex-shrink: 0;
}

.topic-header .topic-info h2 {
  font-size: 30px;
  font-weight: 900;
  letter-spacing: -0.5px;
  margin-bottom: 4px;
}

.topic-header .topic-cat {
  font-size: 12px;
  font-weight: 700;
  color: var(--ink-muted);
  text-transform: uppercase;
  letter-spacing: 1px;
}

.topic-header .topic-meta {
  display: flex;
  gap: 12px;
  margin-top: 6px;
}

.topic-header .meta-item {
  font-size: 11px;
  font-weight: 700;
  padding: 3px 10px;
  border-radius: var(--radius-round);
  border: 1.5px solid;
}

.meta-item.must-know-count {
  background: var(--green-light);
  border-color: var(--green);
  color: var(--green-dark);
}

.meta-item.qa-count {
  background: var(--purple-light);
  border-color: var(--brand);
  color: var(--brand-dark);
}

.meta-item.alt-count {
  background: var(--orange-light);
  border-color: var(--orange);
  color: #9a3412;
}

/* ==========================================================================
   SECTION STYLES
   ========================================================================== */
.section {
  margin-bottom: 28px;
}

.section-title {
  display: flex;
  align-items: center;
  gap: 10px;
  font-size: 16px;
  font-weight: 800;
  padding: 14px 18px;
  border-radius: var(--radius-sm) var(--radius-sm) 0 0;
  border: 3px solid #000;
  border-bottom: none;
  position: relative;
}

.section-title .section-count {
  margin-right: auto;
  font-size: 12px;
  font-weight: 700;
  background: rgba(0,0,0,0.1);
  padding: 2px 10px;
  border-radius: var(--radius-round);
}

.section-title.must-know {
  background: linear-gradient(135deg, var(--green-light), #bbf7d0);
  color: var(--green-dark);
}

.section-title.allowed {
  background: linear-gradient(135deg, var(--blue-light), #bfdbfe);
  color: var(--blue-dark);
}

.section-title.forbidden {
  background: linear-gradient(135deg, var(--red-light), #fecaca);
  color: var(--red-dark);
}

.section-title.questions {
  background: linear-gradient(135deg, var(--purple-light), #e9d5ff);
  color: var(--purple-border);
}

.section-title.alternatives {
  background: linear-gradient(135deg, #fef3c7, #fde68a);
  color: #92400e;
}

.section-body {
  background: var(--card);
  border: 3px solid #000;
  border-radius: 0 0 var(--radius-sm) var(--radius-sm);
  box-shadow: var(--shadow);
  overflow: hidden;
}

/* ==========================================================================
   MUST KNOW CARDS
   ========================================================================== */
.must-know-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: 0;
}

.must-know-item {
  padding: 14px 18px;
  border-bottom: 2px solid var(--border-light);
  display: flex;
  align-items: flex-start;
  gap: 12px;
  font-size: 14px;
  font-weight: 500;
  line-height: 1.6;
  transition: var(--transition-fast);
}

.must-know-item:last-child {
  border-bottom: none;
}

.must-know-item:hover {
  background: var(--green-lighter);
  padding-right: 22px;
}

.must-know-item .num {
  min-width: 30px;
  height: 30px;
  background: linear-gradient(135deg, var(--green), #22c55e);
  color: #fff;
  border-radius: var(--radius-xs);
  display: flex;
  align-items: center;
  justify-content: center;
  font-weight: 900;
  font-size: 12px;
  flex-shrink: 0;
  border: 2px solid var(--green-dark);
  box-shadow: 1px 1px 0 var(--green-dark);
}

.must-know-item .text {
  flex: 1;
}

.must-know-item .text code,
.must-know-item code {
  background: #f1f5f9;
  border: 1.5px solid #cbd5e1;
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 12px;
  font-family: 'Courier New', Consolas, monospace;
  direction: ltr;
  display: inline;
  unicode-bidi: isolate;
}

/* ==========================================================================
   ALLOWED LIST
   ========================================================================== */
.allowed-list {
  list-style: none;
  padding: 0;
}

.allowed-list li {
  padding: 12px 18px;
  border-bottom: 1.5px solid var(--border-light);
  font-size: 14px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: var(--transition-fast);
}

.allowed-list li:last-child {
  border-bottom: none;
}

.allowed-list li:hover {
  background: var(--blue-lighter);
  padding-right: 22px;
}

.allowed-list li .check-icon {
  width: 24px;
  height: 24px;
  background: var(--blue);
  color: #fff;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 900;
  flex-shrink: 0;
  border: 1.5px solid var(--blue-dark);
}

/* ==========================================================================
   FORBIDDEN LIST
   ========================================================================== */
.forbidden-list {
  list-style: none;
  padding: 0;
}

.forbidden-list li {
  padding: 12px 18px;
  border-bottom: 1.5px solid var(--border-light);
  font-size: 14px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: var(--transition-fast);
  position: relative;
}

.forbidden-list li:last-child {
  border-bottom: none;
}

.forbidden-list li:hover {
  background: var(--red-lighter);
  padding-right: 22px;
}

.forbidden-list li .x-icon {
  width: 24px;
  height: 24px;
  background: var(--red);
  color: #fff;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 12px;
  font-weight: 900;
  flex-shrink: 0;
  border: 1.5px solid var(--red-dark);
}

.forbidden-list li .forbidden-text {
  text-decoration: line-through;
  text-decoration-color: var(--red);
  text-decoration-thickness: 2px;
  color: var(--ink-muted);
}

/* ==========================================================================
   ACCORDION Q&A
   ========================================================================== */
.accordion-item {
  border-bottom: 2px solid var(--border-light);
  transition: var(--transition-fast);
}

.accordion-item:last-child {
  border-bottom: none;
}

.accordion-item:hover {
  background: var(--purple-light);
}

.accordion-q {
  padding: 14px 18px;
  cursor: pointer;
  font-weight: 700;
  font-size: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  transition: var(--transition-fast);
  user-select: none;
}

.accordion-q .q-icon {
  width: 28px;
  height: 28px;
  background: var(--brand);
  color: #fff;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 900;
  flex-shrink: 0;
  border: 2px solid var(--brand-dark);
}

.accordion-q .q-text {
  flex: 1;
}

.accordion-q .q-arrow {
  font-size: 14px;
  color: var(--ink-light);
  transition: transform 0.2s ease;
  flex-shrink: 0;
}

.accordion-item.open .accordion-q .q-arrow {
  transform: rotate(90deg);
  color: var(--brand);
}

.accordion-a {
  display: none;
  padding: 0 18px 16px;
  padding-right: 56px;
  font-size: 14px;
  color: var(--ink-muted);
  line-height: 1.9;
  background: rgba(124, 58, 237, 0.03);
  border-top: 1.5px dashed #c4b5fd;
  animation: slideDown 0.25s ease;
}

.accordion-item.open .accordion-a {
  display: block;
}

@keyframes slideDown {
  from {
    opacity: 0;
    transform: translateY(-8px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.accordion-a code {
  background: #f1f5f9;
  border: 1.5px solid #cbd5e1;
  border-radius: 4px;
  padding: 1px 6px;
  font-size: 12px;
  font-family: 'Courier New', Consolas, monospace;
  direction: ltr;
  display: inline;
  unicode-bidi: isolate;
}

/* ==========================================================================
   COMPARISON TABLES
   ========================================================================== */
.alt-table-wrap {
  padding: 18px;
}

.alt-table-title {
  font-weight: 800;
  font-size: 15px;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 8px;
  color: #92400e;
}

.alt-table-title .alt-icon {
  width: 26px;
  height: 26px;
  background: #fbbf24;
  border-radius: 6px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 14px;
  border: 1.5px solid #92400e;
}

.alt-table {
  width: 100%;
  border-collapse: separate;
  border-spacing: 0;
  border: 2.5px solid #000;
  border-radius: var(--radius-sm);
  overflow: hidden;
  font-size: 13px;
}

.alt-table thead {
  position: sticky;
  top: 0;
  z-index: 1;
}

.alt-table th {
  background: linear-gradient(135deg, #1e293b, #334155);
  color: #fff;
  padding: 11px 14px;
  text-align: right;
  font-weight: 700;
  font-size: 12px;
  white-space: nowrap;
  letter-spacing: 0.3px;
}

.alt-table th:first-child {
  text-align: left;
}

.alt-table td {
  padding: 11px 14px;
  border-top: 1.5px solid var(--border-light);
  vertical-align: top;
  line-height: 1.5;
}

.alt-table tr.recommended {
  background: var(--green-lighter);
}

.alt-table tr.recommended td {
  font-weight: 600;
}

.alt-table tr.recommended td:first-child {
  position: relative;
}

.recommended-star {
  display: inline-block;
  margin-left: 6px;
  font-size: 14px;
}

.alt-table tr:not(.recommended):hover td {
  background: var(--card-hover);
}

.alt-table td:first-child {
  font-family: 'Courier New', Consolas, monospace;
  font-size: 11.5px;
  direction: ltr;
  text-align: left;
  max-width: 300px;
  word-break: break-word;
  unicode-bidi: isolate;
}

.alt-table .pros {
  color: var(--green);
  font-weight: 700;
}

.alt-table .cons {
  color: var(--red);
  font-weight: 700;
}

.alt-separator {
  border: none;
  border-top: 2px dashed var(--border-muted);
  margin: 20px 16px;
}

/* ==========================================================================
   EMPTY STATE
   ========================================================================== */
.empty-state {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 450px;
  text-align: center;
  padding: 50px 30px;
}

/* ==========================================================================
   TOAST NOTIFICATION
   ========================================================================== */
.toast {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%) translateY(100px);
  background: #1e293b;
  color: #fff;
  padding: 12px 24px;
  border-radius: var(--radius-round);
  font-size: 14px;
  font-weight: 700;
  box-shadow: 0 10px 40px rgba(0,0,0,0.3);
  border: 2px solid #475569;
  z-index: 1000;
  opacity: 0;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  pointer-events: none;
  display: flex;
  align-items: center;
  gap: 8px;
}

.toast.visible {
  opacity: 1;
  transform: translateX(-50%) translateY(0);
}

.toast .toast-icon {
  font-size: 18px;
}

/* ==========================================================================

   ========================================================================== */
.back-to-top {
  position: fixed;
  bottom: 24px;
  left: 24px;
  width: 44px;
  height: 44px;

  color: #fff;
  border: 3px solid #000;

  font-size: 18px;

  transform: scale(0.8);

  transform: scale(1);

/* ==========================================================================
   CATEGORIES METADATA
   ========================================================================== */
const CATEGORIES = {
  frontend: { name: 'Frontend', icon: '🌐', color: '#2563eb' },
  backend: { name: 'Backend', icon: '⚙️', color: '#16a34a' },
  devops: { name: 'DevOps', icon: '🚀', color: '#f97316' }
};

/* ==========================================================================
   APPLICATION STATE
   ========================================================================== */
let currentTopic = null;
let viewedTopics = [];

// Load viewed topics from localStorage
try {
  const stored = localStorage.getItem('ek-viewed');
  if (stored) {
    viewedTopics = JSON.parse(stored);
    if (!Array.isArray(viewedTopics)) viewedTopics = [];
  }
} catch (e) {
  viewedTopics = [];
}

/* ==========================================================================
   SIDEBAR RENDERING
   ========================================================================== */
function renderSidebar() {
  const sidebar = document.getElementById('sidebar');
  const grouped = {};

  // Group topics by category
  Object.entries(TOPICS).forEach(([id, topic]) => {
    if (!grouped[topic.cat]) grouped[topic.cat] = [];
    grouped[topic.cat].push({ id, ...topic });
  });

  let html = '';

  // Sidebar header
  html += `
    <div class="sidebar-header">
      <h3>
        📑 נושאים
        <span class="total-badge">${Object.keys(TOPICS).length}</span>
      </h3>
    </div>
  `;

  // Render each category group
  Object.entries(CATEGORIES).forEach(([catId, catInfo]) => {
    if (!grouped[catId]) return;

    html += `
      <div class="sidebar-group">
        <div class="sidebar-group-title">
          ${catInfo.icon} ${catInfo.name}
        </div>
        <div class="sidebar-items-row">
    `;

    grouped[catId].forEach(topic => {
      const isActive = currentTopic === topic.id;
      const isViewed = viewedTopics.includes(topic.id);
      const totalItems = topic.mustKnow.length;

      html += `
        <div class="sidebar-item ${isActive ? 'active' : ''}"
             onclick="selectTopic('${topic.id}')"
             data-topic="${topic.id}"
             role="button"
             tabindex="0"
             aria-label="${topic.name}">
          <span class="icon">${topic.icon}</span>
          <span class="name">${topic.name}</span>
          <span class="count-badge">${totalItems}</span>
          ${isViewed ? '<span class="viewed-badge" title="נצפה"></span>' : ''}
        </div>
      `;
    });

    html += `</div></div>`;
  });

  sidebar.innerHTML = html;

  // Add keyboard navigation to sidebar items
  sidebar.querySelectorAll('.sidebar-item').forEach(item => {
    item.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        item.click();
      }
    });
  });
}

/* ==========================================================================
   TOPIC CONTENT RENDERING
   ========================================================================== */
function renderTopic(topicId) {
  const topic = TOPICS[topicId];
  if (!topic) return;

  const main = document.getElementById('main-content');
  let html = `<div class="fade-in">`;

  // ---- Topic Header ----
  html += `
    <div class="topic-header">
      <div class="topic-icon">${topic.icon}</div>
      <div class="topic-info">
        <h2>${topic.name}</h2>
        <div class="topic-cat">${CATEGORIES[topic.cat].icon} ${CATEGORIES[topic.cat].name}</div>
        <div class="topic-meta">
          <span class="meta-item must-know-count">${topic.mustKnow.length} חובה לדעת</span>
          <span class="meta-item qa-count">${topic.questions.length} שאלות</span>
          ${topic.lineAlternatives.length > 0 ? `<span class="meta-item alt-count">${topic.lineAlternatives.length} טבלאות</span>` : ''}
        </div>
      </div>
    </div>
  `;

  // ---- Must Know Section ----
  html += `
    <div class="section">
      <div class="section-title must-know">
        📌 חובה לדעת
        <span class="section-count">${topic.mustKnow.length} פריטים</span>
      </div>
      <div class="section-body">
        <div class="must-know-grid">
  `;

  topic.mustKnow.forEach((item, i) => {
    html += `
      <div class="must-know-item">
        <span class="num">${i + 1}</span>
        <span class="text">${formatText(item)}</span>
      </div>
    `;
  });

  html += `</div></div></div>`;

  // ---- Allowed Section ----
  html += `
    <div class="section">
      <div class="section-title allowed">
        ✅ מותר
        <span class="section-count">${topic.allowed.length} פריטים</span>
      </div>
      <div class="section-body">
        <ul class="allowed-list">
  `;

  topic.allowed.forEach(item => {
    html += `
      <li>
        <span class="check-icon">✓</span>
        <span>${formatText(item)}</span>
      </li>
    `;
  });

  html += `</ul></div></div>`;

  // ---- Forbidden Section ----
  html += `
    <div class="section">
      <div class="section-title forbidden">
        🚫 אסור
        <span class="section-count">${topic.forbidden.length} פריטים</span>
      </div>
      <div class="section-body">
        <ul class="forbidden-list">
  `;

  topic.forbidden.forEach(item => {
    html += `
      <li>
        <span class="x-icon">✘</span>
        <span class="forbidden-text">${formatText(item)}</span>
      </li>
    `;
  });

  html += `</ul></div></div>`;

  // ---- Questions Section ----
  html += `
    <div class="section">
      <div class="section-title questions">
        ❓ שאלות נפוצות
        <span class="section-count">${topic.questions.length} שאלות</span>
      </div>
      <div class="section-body">
  `;

  topic.questions.forEach((qa, i) => {
    html += `
      <div class="accordion-item" data-index="${i}">
        <div class="accordion-q" onclick="toggleAccordion(this.parentElement)">
          <span class="q-icon">?</span>
          <span class="q-text">${escapeHtml(qa.q)}</span>
          <span class="q-arrow">▸</span>
        </div>
        <div class="accordion-a">${formatText(qa.a)}</div>
      </div>
    `;
  });

  html += `</div></div>`;

  // ---- Line Alternatives Section ----
  if (topic.lineAlternatives && topic.lineAlternatives.length > 0) {
    html += `
      <div class="section">
        <div class="section-title alternatives">
          🔄 חלופות קוד
          <span class="section-count">${topic.lineAlternatives.length} טבלאות</span>
        </div>
        <div class="section-body">
    `;

    topic.lineAlternatives.forEach((alt, idx) => {
      if (idx > 0) html += '<hr class="alt-separator">';

      html += `
        <div class="alt-table-wrap">
          <div class="alt-table-title">
            <span class="alt-icon">🔄</span>
            ${escapeHtml(alt.title)}
          </div>
          <table class="alt-table">
            <thead>
              <tr>
                <th>קוד / אפשרות</th>
                <th>מתי</th>
                <th>יתרונות</th>
                <th>חסרונות</th>
              </tr>
            </thead>
            <tbody>
      `;

      alt.rows.forEach(row => {
        html += `
          <tr class="${row.recommended ? 'recommended' : ''}">
            <td>${escapeHtml(row.opt)}${row.recommended ? '<span class="recommended-star"> ⭐</span>' : ''}</td>
            <td>${escapeHtml(row.when)}</td>
            <td class="pros">${escapeHtml(row.pros)}</td>
            <td class="cons">${escapeHtml(row.cons)}</td>
          </tr>
        `;
      });

      html += `</tbody></table></div>`;
    });

    html += `</div></div>`;
  }

  html += `</div>`; // Close fade-in wrapper
  main.innerHTML = html;

  // Scroll main to top
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ==========================================================================
   TOPIC SELECTION
   ========================================================================== */
function selectTopic(topicId) {
  if (!TOPICS[topicId]) return;

  currentTopic = topicId;

  // Mark as viewed and persist
  if (!viewedTopics.includes(topicId)) {
    viewedTopics.push(topicId);
    localStorage.setItem('ek-viewed', JSON.stringify(viewedTopics));
    showToast('✅', `${TOPICS[topicId].name} סומן כנצפה`);
  }

  // Update URL hash
  history.replaceState(null, '', '#' + topicId);

  // Render
  renderSidebar();
  renderTopic(topicId);
  updateProgress();

  // On mobile scroll to content
  if (window.innerWidth <= 768) {
    setTimeout(() => {
      document.getElementById('main-content').scrollIntoView({ behavior: 'smooth' });
    }, 100);
  }
}

/* ==========================================================================
   ACCORDION TOGGLE
   ========================================================================== */
function toggleAccordion(el) {
  // Close other open items in same section
  const parent = el.parentElement;
  const siblings = parent.querySelectorAll('.accordion-item.open');
  siblings.forEach(sib => {
    if (sib !== el) sib.classList.remove('open');
  });

  el.classList.toggle('open');
}

/* ==========================================================================
   PROGRESS TRACKING
   ========================================================================== */
function updateProgress() {
  const total = Object.keys(TOPICS).length;
  const viewed = viewedTopics.length;
  const pct = Math.round((viewed / total) * 100);

  const progressText = document.getElementById('progress-text');
  const progressFill = document.getElementById('progress-fill');

  if (progressText) {
    progressText.textContent = `${viewed}/${total} נושאים`;
  }
  if (progressFill) {
    progressFill.style.width = pct + '%';
  }
}

/* ==========================================================================
   SEARCH FUNCTIONALITY
   ========================================================================== */
function initSearch() {
  const input = document.getElementById('search-input');
  const results = document.getElementById('search-results');

  if (!input || !results) return;

  let debounceTimer = null;

  input.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      const query = input.value.trim().toLowerCase();

      if (query.length < 2) {
        results.classList.remove('visible');
        return;
      }

      const matches = searchTopics(query);

      if (matches.length === 0) {
        results.innerHTML = '<div class="search-result-item" style="color:var(--ink-muted);cursor:default;justify-content:center;">לא נמצאו תוצאות</div>';
        results.classList.add('visible');
        return;
      }

      let html = '';
      matches.slice(0, 8).forEach(match => {
        html += `
          <div class="search-result-item" onclick="selectTopic('${match.topicId}'); clearSearch();">
            <span>${TOPICS[match.topicId].icon}</span>
            <span>${escapeHtml(match.text)}</span>
            <span class="result-cat">${TOPICS[match.topicId].name}</span>
          </div>
        `;
      });

      results.innerHTML = html;
      results.classList.add('visible');
    }, 150);
  });

  // Close on click outside
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.hero-search')) {
      results.classList.remove('visible');
    }
  });

  // Handle Escape key
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') {
      clearSearch();
      input.blur();
    }
    if (e.key === 'Enter') {
      const firstResult = results.querySelector('.search-result-item');
      if (firstResult) firstResult.click();
    }
  });

  // Keyboard shortcut: / to focus search
  document.addEventListener('keydown', (e) => {
    if (e.key === '/' && !e.target.closest('input, textarea')) {
      e.preventDefault();
      input.focus();
    }
  });
}

function searchTopics(query) {
  const results = [];

  Object.entries(TOPICS).forEach(([id, topic]) => {
    // Search in topic name
    if (topic.name.toLowerCase().includes(query)) {
      results.push({ topicId: id, text: topic.name, score: 10 });
    }

    // Search in mustKnow
    topic.mustKnow.forEach(item => {
      if (item.toLowerCase().includes(query)) {
        results.push({ topicId: id, text: truncate(item, 60), score: 5 });
      }
    });

    // Search in questions
    topic.questions.forEach(qa => {
      if (qa.q.toLowerCase().includes(query)) {
        results.push({ topicId: id, text: qa.q, score: 7 });
      }
      if (qa.a.toLowerCase().includes(query)) {
        results.push({ topicId: id, text: truncate(qa.a, 60), score: 3 });
      }
    });

    // Search in allowed/forbidden
    topic.allowed.forEach(item => {
      if (item.toLowerCase().includes(query)) {
        results.push({ topicId: id, text: item, score: 4 });
      }
    });

    topic.forbidden.forEach(item => {
      if (item.toLowerCase().includes(query)) {
        results.push({ topicId: id, text: item, score: 4 });
      }
    });
  });

  // Sort by score descending
  results.sort((a, b) => b.score - a.score);

  // Remove duplicates
  const seen = new Set();
  return results.filter(r => {
    const key = r.topicId + ':' + r.text;
    if (seen.has(key)) return false;
    seen.add(key);
    return true;
  });
}

function clearSearch() {
  const input = document.getElementById('search-input');
  const results = document.getElementById('search-results');
  if (input) input.value = '';
  if (results) results.classList.remove('visible');
}

/* ==========================================================================
   TOAST NOTIFICATIONS
   ========================================================================== */
let toastTimeout = null;

function showToast(icon, message) {
  const toast = document.getElementById('toast');
  if (!toast) return;

  const toastIcon = toast.querySelector('.toast-icon');
  const toastText = toast.querySelector('.toast-text');

  if (toastIcon) toastIcon.textContent = icon;
  if (toastText) toastText.textContent = message;

  toast.classList.add('visible');

  if (toastTimeout) clearTimeout(toastTimeout);
  toastTimeout = setTimeout(() => {
    toast.classList.remove('visible');
  }, 2500);
}

/* ==========================================================================
   BACK TO TOP BUTTON
   ========================================================================== */
function initBackToTop() {
  const btn = document.getElementById('back-to-top');
  if (!btn) return;

  window.addEventListener('scroll', () => {
    if (window.scrollY > 400) {
      btn.classList.add('visible');
    } else {
      btn.classList.remove('visible');
    }
  }, { passive: true });
}

function scrollToTop() {
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

/* ==========================================================================
   KEYBOARD NAVIGATION
   ========================================================================== */
function initKeyboardNav() {
  const topicIds = Object.keys(TOPICS);

  document.addEventListener('keydown', (e) => {
    // Skip if user is in an input
    if (e.target.closest('input, textarea')) return;

    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();

      const currentIndex = currentTopic ? topicIds.indexOf(currentTopic) : -1;
      let nextIndex;

      if (e.key === 'ArrowDown') {
        nextIndex = currentIndex < topicIds.length - 1 ? currentIndex + 1 : 0;
      } else {
        nextIndex = currentIndex > 0 ? currentIndex - 1 : topicIds.length - 1;
      }

      selectTopic(topicIds[nextIndex]);
    }

    // Expand/collapse all Q&A with 'e'
    if (e.key === 'e' && currentTopic) {
      const items = document.querySelectorAll('.accordion-item');
      if (items.length === 0) return;
      const allOpen = [...items].every(i => i.classList.contains('open'));
      items.forEach(item => {
        if (allOpen) {
          item.classList.remove('open');
        } else {
          item.classList.add('open');
        }
      });
    }
  });
}

/* ==========================================================================
   TEXT FORMATTING HELPERS
   ========================================================================== */
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function formatText(text) {
  // Escape HTML first
  let escaped = escapeHtml(text);
  // No additional formatting needed for this dataset
  return escaped;
}

function truncate(text, maxLen) {
  if (text.length <= maxLen) return text;
  return text.substring(0, maxLen) + '...';
}

/* ==========================================================================
   INITIALIZATION
   ========================================================================== */
document.addEventListener('DOMContentLoaded', () => {
  // Render sidebar
  renderSidebar();

  // Update progress bar
  updateProgress();

  // Initialize search
  initSearch();

  // Initialize back to top button
  initBackToTop();

  // Initialize keyboard navigation
  initKeyboardNav();

  // Check URL hash for initial topic
  const hash = window.location.hash.replace('#', '');
  if (hash && TOPICS[hash]) {
    selectTopic(hash);
  }

  // Listen for hash changes (browser back/forward)
  window.addEventListener('hashchange', () => {
    const newHash = window.location.hash.replace('#', '');
    if (newHash && TOPICS[newHash] && newHash !== currentTopic) {
      selectTopic(newHash);
    }
  });
});
</script>
