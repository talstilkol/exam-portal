<!doctype html>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Heebo,Arial,sans-serif;background:linear-gradient(135deg,#fef9c3,#dbeafe);min-height:100vh;display:flex;align-items:center;justify-content:center;direction:rtl;padding:24px}
.card{background:#fff;border:3px solid #000;border-radius:20px;box-shadow:6px 6px 0 #000;padding:48px 40px;max-width:520px;width:100%;text-align:center}
h1{font-size:72px;margin:0;font-weight:900;background:linear-gradient(135deg,#7c3aed,#2563eb);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
h2{font-size:24px;margin:8px 0 16px;font-weight:900;color:#0f172a}
p{color:#475569;margin:0 0 28px;line-height:1.7}
.btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;padding:12px 24px;border:2.5px solid #000;border-radius:12px;font-family:Heebo,Arial,sans-serif;font-weight:900;font-size:14px;text-decoration:none;cursor:pointer;box-shadow:3px 3px 0 #000;transition:.15s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:4px 4px 0 #000}
.btn-primary{background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff}
.btn-secondary{background:#f1f5f9;color:#0f172a}
@media(prefers-color-scheme:dark){body{background:linear-gradient(135deg,#0f172a,#1e1b4b)}.card{background:#1e293b;border-color:#334155;box-shadow:6px 6px 0 #000}h2{color:#f1f5f9}p{color:#94a3b8}.btn-secondary{background:#334155;color:#e2e8f0}}
</style>
</head>
<body>
<div class="card">

  <div class="btns">
    <a class="btn btn-primary" href="/">🏠 חזרה לפורטל</a>
    <a class="btn btn-secondary" href="/extras/simulations.html">🧪 סימולציות</a>
  </div>
</div>
</body>
</html>
